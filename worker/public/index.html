      <span style="color:#94a3b8;font-weight:400;font-size:12px">点名字展开同名的多台身份</span>
    </div>
    <div id="admUsersBody" style="display:none">
      <table style="width:100%;border-collapse:collapse;font-size:12.5px;display:block;max-height:240px;overflow-y:auto">
        <thead><tr style="color:#64748b;text-align:left">
          <th style="padding:5px 6px">LDAP账号 / 名字</th><th>设备</th><th>状态</th><th>次数</th><th>最后使用</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <!-- 邀请管理（2026-09-25） -->
    <div style="margin:14px 0 6px;color:#334155;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span id="admInvHead" style="cursor:pointer;user-select:none">
        <span id="admInvArr">▸</span> <span id="admInvCount">${_invL.count}</span>
        <span style="color:#94a3b8;font-weight:400;font-size:12px">点击展开</span>
      </span>
      <select id="invKind" title="邀请类型" style="border:1px solid #e2e8f0;border-radius:8px;padding:4px 6px;font-size:12.5px">
        <option value="multi">多人共用</option>
        <option value="single">一次性（一人）</option>
      </select>
      <input id="invNote" placeholder="备注（只给自己看，如「第三批-门店」）" title="只是给自己标记这条邀请；2026-11-02 起不再拿它给成员起名（成员自己填名字）" style="flex:1;border:1px solid #e2e8f0;border-radius:8px;padding:4px 8px;font-size:12.5px">
      <input id="invTtl" type="number" min="1" value="12" title="邀请链接多少小时内有效（默认 12 小时）" style="width:88px;border:1px solid #e2e8f0;border-radius:8px;padding:4px 8px;font-size:12.5px">
      <button type="button" id="invCreate" style="border:0;background:#2563eb;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px">＋ 生成</button>
    </div>
    <div id="admInvBody" style="display:none">
      <table style="width:100%;border-collapse:collapse;font-size:12.5px;display:block;max-height:200px;overflow-y:auto">
        <thead><tr style="color:#64748b;text-align:left">
          <th style="padding:5px 6px">id</th><th>类型</th><th>备注</th><th>到期</th><th>已领</th><th>状态</th><th></th>
        </tr></thead>
        <tbody>${_invL.rows}</tbody>
      </table>
    </div>
    <div id="invResult" style="margin-top:8px;color:#0f172a;font-size:12px"></div>
    <div style="margin-top:10px;color:#94a3b8;font-size:11.5px">
      ⚠️ 停用会立即让该用户的令牌失效（写吊销名单）；不能停用自己。
      作废邀请只影响**尚未领取**的链接，已领过的人不受影响。操作均写审计日志。
    </div>
  </div>`;
  document.body.appendChild(wrap);
  $("admClose").addEventListener("click",()=>wrap.remove());
  wrap.addEventListener("click",e=>{ if(e.target===wrap) wrap.remove(); });
  // ── 用户 / 邀请列表折叠（2026-09-25：默认收起，点标题展开）──
  const fold=(headId,arrId,bodyId)=>{
    $(headId).addEventListener("click",()=>{
      const b=$(bodyId), open=b.style.display!=="none";
      b.style.display=open?"none":"";
      $(arrId).textContent=open?"▸":"▾";
    });
  };
  fold("admUsersHead","admUsersArr","admUsersBody");
  fold("admInvHead","admInvArr","admInvBody");

  // ── 使用统计（2026-10-12）：打开面板即拉一次，切换天数重拉 ──
  const refreshUsage = async (days)=>{
    const tip=$("admUsageTip"); if(tip) tip.textContent="加载中…";
    const u = await loadUsage(days);
    _usageCache = u; _usageDays = days||_usageDays;
    const box=$("admUsage");
    if(box) box.innerHTML = usageHtml(u);
    if(tip) tip.textContent = u ? "" : "拉取失败";
  };
  const sel=$("admUsageDays");
  if(sel) sel.addEventListener("change", ()=>refreshUsage(parseInt(sel.value,10)||15));
  refreshUsage(_usageDays);

  // ── 知识库热重载 ──
  $("admReload").addEventListener("click", async ()=>{
    const tip=$("admTip"); tip.textContent="重载中…（约 10~30 秒）";
    try{
      const r=await fetch("/admin/reload",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({}),signal:AbortSignal.timeout(120000)});
      const j=await r.json().catch(()=>({}));
      tip.textContent = r.ok ? `已重载：${j.docs||"-"} 段` : ("失败："+(j.detail||r.status));
      showToast(r.ok?"知识库已重载":"重载失败", r.ok?"ok":"bad");
      if(r.ok){ checkHealth && checkHealth(); }
    }catch(e){ tip.textContent="重载失败："+(e.message||e); }
  });
  // ── 案例审查（新标签页打开，不打断当前会话）──
  $("admReview").addEventListener("click", ()=>{ window.open("/review","_blank"); });

  // ── 邀请：生成 ──
  $("invCreate").addEventListener("click", async ()=>{
    const note=($("invNote").value||"").trim();
    // ⚠️ 2026-10-23：输入框默认值 12；**清空时也按 12 算**。
    //   原来空值传 0，后端 `ttl_hours or None` 会退回 AUTH_BIND_TTL_HOURS(24) ——
    //   于是"表单显示空、实际 24 小时"，跟主人要的 12 不一致。这里兜住。
    const ttl=parseInt($("invTtl").value||"12",10)||12;
    const kind=($("invKind") && $("invKind").value) || "multi";
    try{
      const r=await fetch("/admin/invite/create",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({note, ttl_hours: ttl||0, kind}),signal:AbortSignal.timeout(15000)});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){ showToast("生成失败："+(j.detail||r.status),"bad"); return; }
      const url=location.origin + (j.url||"");
      const isOne=(j.kind==="single");
      $("invResult").innerHTML = `✅ 已生成 <b>${esc(j.id)}</b>（${esc(j.note||"")}，${j.ttl_hours} 小时有效${isOne?"，<b style=\"color:#b45309\">一次性</b>":""}）<br>
        ${isOne?'<span style="color:#b45309">⚠️ 一次性邀请：<b>只能给一个人</b>，对方领取后链接立即失效 —— 请单独发给本人，不要群发。</span><br>':''}
        <input id="invUrl" readonly value="${esc(url)}" style="width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:5px 8px;margin-top:5px;font-size:12px">
        <button type="button" id="invCopy" style="margin-top:5px;border:0;background:#0f172a;color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer">复制链接</button>`;
      $("invCopy").addEventListener("click", async ()=>{
        try{ await navigator.clipboard.writeText(url); showToast("链接已复制","ok"); }
        catch(_){ $("invUrl").select(); showToast("请按 Ctrl/⌘+C 复制","ok"); }
      });
      // ⭐ 生成后**必须刷新列表**：否则新邀请不出现在列表里（主人报的「列表没有数据&不刷新」）。
      //   用局部刷新而非 openAdmin() —— 后者会把上面这个链接框冲掉。
      const okr = await refreshInviteList();
      showToast(okr ? "已生成，列表已刷新" : "已生成（列表刷新失败，重开面板可看到）", "ok");
    }catch(e){ showToast("生成失败："+(e.message||e),"bad"); }
  });
  // ── 邀请：作废 ──
  wrap.querySelectorAll("[data-inv]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const iid=btn.getAttribute("data-inv");
      if(!(await confirmBox(`作废邀请 ${iid}？尚未领取的链接会立即失效。`, "作废", "取消"))) return;
      btn.disabled=true;
      try{
        const r=await fetch("/admin/invite/revoke",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({invite_id:iid}),signal:AbortSignal.timeout(10000)});
        const j=await r.json().catch(()=>({}));
        showToast(r.ok?"已作废":"失败："+(j.detail||r.status), r.ok?"ok":"bad");
      }catch(e){ showToast("操作失败："+(e.message||e),"bad"); }
      wrap.remove(); openAdmin();
    });
  });
  // ── 邀请：重新启用（清空「已领」名单）2026-10-23 ──
  // 起因：一次性邀请被领走后链接就 410，而领取幂等**只靠浏览器 Cookie**
  //（换浏览器/无痕/从微信打开 → 被当成新的人 → 把邀请消耗掉）
  // ⇒ 给管理员一个一键救回的动作，比"作废了重新生成"顺手。
  wrap.querySelectorAll("[data-invreset]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const iid=btn.getAttribute("data-invreset");
      if(!(await confirmBox(`重新启用邀请 ${iid}？\n\n会清空它的「已领」名单，让链接能再服务一个人。\n已经领过的人不受影响（他们的密钥早就独立生成了）。`, "重新启用", "取消"))) return;
      btn.disabled=true;
      try{
        const r=await fetch("/admin/invite/reset",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({invite_id:iid}),signal:AbortSignal.timeout(10000)});
        const j=await r.json().catch(()=>({}));
        showToast(r.ok?`已重新启用（清空 ${(j.cleared==null?0:j.cleared)} 条已领记录）`:"失败："+(j.detail||r.status), r.ok?"ok":"bad");
      }catch(e){ showToast("操作失败："+(e.message||e),"bad"); }
      wrap.remove(); openAdmin();
    });
  });
  // ── 用户分组：点一下展开同名的多个身份（2026-11-02）──
  wrap.querySelectorAll(".adm-grow").forEach(tr=>{
    tr.addEventListener("click", e=>{
      if(e.target.closest("button")) return;
      const gi=tr.getAttribute("data-g");
      const ds=wrap.querySelectorAll('.adm-drow[data-g="'+gi+'"]');
      if(!ds.length) return;
      const open=ds[0].style.display!=="none";
      ds.forEach(r=>{ r.style.display = open?"none":"table-row"; });
      const a=tr.querySelector(".adm-garr"); if(a) a.textContent = open?"▸":"▾";
    });
  });

  // ── 改名（2026-11-02）：把老邀请的「灰度第一批-01」改成人名；同名自动归组 ──
  wrap.querySelectorAll("[data-rename]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const uid=btn.getAttribute("data-rename");
      const v=await inputBox("把「"+(_names[uid]||uid)+"」改成什么名字？同名会归到同一组。", "例：张三", "保存");
      if(!v) return;
      if(v.trim().length<2){ showToast("名字至少 2 个字","bad"); return; }
      btn.disabled=true;
      try{
        const r=await fetch("/admin/user/rename",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({uid, name:v.trim()}), signal:AbortSignal.timeout(10000)});
        const j=await r.json().catch(()=>({}));
        showToast(r.ok? "已改名为「"+(j.name||v.trim())+"」" : ("失败："+(j.detail||r.status)), r.ok?"ok":"bad");
      }catch(e){ showToast("操作失败："+(e.message||e),"bad"); }
      wrap.remove(); openAdmin();     // 重新分组
    });
  });

  wrap.querySelectorAll("[data-act]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const uid=btn.getAttribute("data-uid"), act=btn.getAttribute("data-act");
      if(act==="disable" && !(await confirmBox(`停用 ${uid}？其令牌会立即失效。`, "停用", "取消"))) return;
      btn.disabled=true;
      try{
        const r=await fetch(act==="disable"?"/admin/user/disable":"/admin/user/enable",{
          method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({uid}), signal:AbortSignal.timeout(10000)
        });
        const j=await r.json().catch(()=>({}));
        showToast(r.ok ? "已"+(act==="disable"?"停用":"恢复") : ("失败："+(j.detail||r.status)), r.ok?"ok":"bad");
      }catch(e){ showToast("操作失败："+(e.message||e),"bad"); }
      wrap.remove(); openAdmin();   // 刷新列表
    });
  });
}
/* ===== 补全资料（2026-11-02 补名字 · 2026-11-04 加 LDAP 账号）=====
   老邀请流程给每个人的名字是「灰度第一批-01」这种自动编号，管理员看不出是谁。
   2026-11-04 起管理页改为按 LDAP 账号认人 ⇒ 这两项必须在**下次使用时**补齐。
   ⇒ 缺哪项问哪项；「先不填」只对**本次会话**有效，关页面重进还会再问。
   ⚠️ 不硬锁死：一线可能正在处理紧急报障，允许「先不填」，但会一直提醒。 */
(function(){
  const SKIP = "profileAskSkipped";
  function esc2(s){ return esc(String(s==null?"":s)); }
  function render(opt){
    if(document.getElementById("profileAsk")) return;
    try{ if(sessionStorage.getItem(SKIP) === "1") return; }catch(e){}
    const needName = !!opt.needName, needStaff = !!opt.needStaff;
    if(!needName && !needStaff) return;
    const mask = document.createElement("div");
    mask.id = "profileAsk";
    mask.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px";
    mask.innerHTML = `<div style="background:#fff;border-radius:14px;max-width:420px;width:100%;padding:18px;font:13.5px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#0f172a;box-shadow:0 10px 30px rgba(15,23,42,.2)">
      <div style="font-size:15px;font-weight:600;margin-bottom:4px">还差一步：补全你的账号信息</div>
      <div style="color:#64748b;font-size:12.5px;margin-bottom:10px">管理员靠这两项认人 —— 老邀请流程自动起的名字（如「灰度第一批-01」）看不出是谁。</div>
      ${needName ? `<label style="display:block;margin:8px 0 4px;color:#334155">你的名字</label>
        <input id="paName" maxlength="24" value="${esc2(opt.name||"")}" placeholder="例：张三"
          style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:7px 9px;font-size:13.5px;font-family:inherit">` : ""}
      ${needStaff ? `<label style="display:block;margin:10px 0 4px;color:#334155">LDAP 账号 <span style="color:#94a3b8">（与域账号一致）</span></label>
        <input id="paStaff" maxlength="40" value="${esc2(opt.staff||"")}" placeholder="例：zuoyuan1" autocomplete="username"
          style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:7px 9px;font-size:13.5px;font-family:inherit">` : ""}
      <div id="paErr" style="color:#b91c1c;font-size:12.5px;min-height:18px;margin-top:6px"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:2px">
        <button id="paSkip" style="border:0;background:transparent;color:#64748b;cursor:pointer;font-family:inherit;font-size:12.5px">先不填（下次还会提醒）</button>
        <button id="paOk" style="border:0;background:#2563eb;color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-family:inherit">保存并继续</button>
      </div></div>`;
    document.body.appendChild(mask);
    $("paSkip").addEventListener("click", ()=>{ try{ sessionStorage.setItem(SKIP, "1"); }catch(e){} mask.remove(); });
    $("paOk").addEventListener("click", ()=>save(mask, opt));
    const first = needName ? $("paName") : $("paStaff");
    if(first) first.focus();
    [["paName"],["paStaff"]].forEach(([id])=>{ const el=$(id); if(el) el.addEventListener("keydown", e=>{ if(e.key==="Enter") save(mask, opt); }); });
  }
  async function save(mask, opt){
    const err = $("paErr");
    const nEl = $("paName"), hEl = $("paStaff");
    const n = nEl ? (nEl.value || "").trim() : "";
    const h = hEl ? (hEl.value || "").trim() : "";
    if(opt.needName && n.length < 2){ err.textContent = "名字至少 2 个字"; nEl.focus(); return; }
    if(opt.needStaff && h.length < 2){ err.textContent = "请填写你的 LDAP 账号"; hEl.focus(); return; }
    err.textContent = "";
    const btn = $("paOk"); btn.disabled = true; btn.textContent = "保存中…";
    try{
      if(opt.needName){
        const r = await fetch("/auth/name", {method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({name: n}), signal: AbortSignal.timeout(10000)});
        const j = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(j.detail || ("HTTP " + r.status));
      }
      if(opt.needStaff){
        const r = await fetch("/auth/staff", {method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({staff: h}), signal: AbortSignal.timeout(10000)});
        const j = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(j.detail || ("HTTP " + r.status));
      }
      mask.remove();
      showToast("已保存，谢谢！", "ok");
    }catch(e){
      btn.disabled = false; btn.textContent = "保存并继续";
      err.textContent = "保存失败：" + (e.message || e);
    }
  }
  setTimeout(async ()=>{
    try{
      const r = await fetch("/auth/whoami", {cache:"no-store", signal: AbortSignal.timeout(8000)});
      const j = await r.json();
      if(j && j.ok){
        const needName = !!j.needs_name;
        const needStaff = !j.staff_id;
        if(needName || needStaff) render({needName, needStaff, name: j.name || "", staff: j.staff_id || ""});
      }
    }catch(e){ /* 拿不到就静默，不影响主流程 */ }
  }, 1200);
})();

initAdmin();
$("joinBtn").addEventListener("click", async ()=>{
  const v = await inputBox("粘贴会话 ID（pos- 开头、共 14 位字符）", "pos-xxxxxxxxxxxxxx", "继续");
  if(!v) return;                                           // 取消或没填
  if(thread.length && !(await confirmBox("「继续会话」会用拉取到的内容替换当前这段对话，确定吗？", "替换", "取消"))) return;
  openSession(v);
});

/* ========== 状态检测 ========== */
/* 状态栏文字的"底稿"。⚠️ 排队时会在它后面追加「你排在第 N 位」，
   等回答回来再用这份底稿复原 —— 不记底稿的话，复原时会把「知识 X 段」弄丢。
   ⚠️ 用 `var` 而不是 `let`（2026-10-09）：等待话术的 `stopWaitHints()` 时机很早，
   可能早于这里执行；`let` 会落进**暂时性死区**直接抛 ReferenceError，
   而 `var` 声明提升、初值为 undefined，配合 `||` 兜底就不会炸。 */
var _statusBase = "助手 在线";

/* 服务状态行的显隐（2026-10-23 主人要求：正常时不显示那一行）。
   ⚠️ 三种情况必须显示：离线告警 / 排队位次 / 处理中预计耗时。
   其余情况（正常在线、知识段数这类日常信息）一律隐藏，别再占一行版面。 */
function _showStatus(show){
  const el=$("statusLine"); if(!el) return;
  if(show) el.classList.add("show"); else el.classList.remove("show");
}

function setStatusText(t){
  const el=$("statusText"); if(el) el.textContent=t;
}

/* 页头副标题 = 实时状态（2026-10-23 主人要求）。
   `state` 三态：on（全绿）/ partial（黄：AI 正常但内网通道离线）/ off（红：AI 不可用）。
   ⚠️ 知识**篇数**用 /healthz 的 `kb_files`（去重文件数）；后端版本旧、没这个字段时
      退回 `docs`（切块数）并如实标成「段」—— 不能把 7000 段说成 7000 篇。 */
function setHsub(text, state){
  const el=$("hsubStatus"), t=$("hsubText");
  if(t) t.textContent=text;
  if(el) el.className = "hsub" + (state ? " "+state : "");
}
async function checkHealth(){
  try{
    const r = await fetch("/healthz",{signal:AbortSignal.timeout(8000)});
    const j = await r.json().catch(()=>({}));
    if(r.ok && j.status==="ok"){
      $("statusDot").className="dot on";
      $("statusLine").className="statusline on";
      // 2026-09-28 主人要求：「数据在线」= 内网通道状态（与管理面板那项同源，来自 /healthz.intranet）
      // ⭐ 2026-10-28 主人要求：**内网状态只对管理员显示**，普通用户完全看不到这一节。
      //    身份来自 initAdmin() 的 /admin/status（后端判 X-Auth-User）；拿不到就是普通用户。
      const isAdmin = !!_admin;
      const it = j.intranet || {};
      let itTxt = "数据检测中";                       // 后端还没探到（首次加载/刚重启）
      if(it.enabled === false) itTxt = "数据未启用";   // 未配置内网通道
      else if(it.online === true) itTxt = "数据在线";
      else if(it.online === false) itTxt = "数据离线";
      _statusBase = isAdmin
        ? `助手 在线 · 知识 ${j.docs||"-"} 段 · ${itTxt}`
        : `助手 在线 · 知识 ${j.docs||"-"} 段`;
      // ---- 页头副标题：助手在线 · 内网在线 · 知识 118 篇 / 11911 段（内网段仅管理员可见）----
      // ⚠️ 2026-10-27：**篇数和段数都要显示**。只显示「篇」会被误读成"知识库缩水了"
      //    （118 看着比之前的大几千少很多），实际 118 是 .md 文件数、11911 是切块数，
      //    同一份知识库的两个维度。两个都给，疑问自然消失。
      const kbTxt = (j.kb_files === undefined || j.kb_files === null)
        ? `知识 ${j.docs||"-"} 段`                     // 后端还没上 kb_files：如实说"段"
        : `知识 ${j.kb_files} 篇 / ${j.docs||"-"} 段`;
      let itShort = "内网检测中";
      if(it.enabled === false) itShort = "内网未启用";
      else if(it.online === true) itShort = "内网在线";
      else if(it.online === false) itShort = "内网离线";
      // AI 正常 + 内网离线 ⇒ 黄灯：还能问答，但查不到终端数据（这是**部分可用**，不是故障）
      // 普通用户看不到内网，自然也不该因为内网离线变黄灯 —— 一律按绿灯处理。
      setHsub(isAdmin ? `助手在线 · ${itShort} · ${kbTxt}` : `助手在线 · ${kbTxt}`,
              (isAdmin && it.online === false) ? "partial" : "on");
      // ⭐ 2026-10-23 主人要求：正常时**不显示这一行**（隐藏，不占版面）。
      //    它只在「排队 / 处理中」时才被 _showStatus(true) 显式打开。
      _showStatus(false);
      // 顺带看一眼系统忙不忙：并发跑满时提示「新提问要排队」，让用户有预期
      fetch("/queue-status",{signal:AbortSignal.timeout(4000)})
        .then(q=>q.json()).then(q=>{
          if(q && q.limit && (q.active||0) >= q.limit){
            _statusBase += " · 繁忙（新提问需排队）";
            if(!_queueTimer){ setStatusText(_statusBase); _showStatus(true); }
          }
        }).catch(()=>{});
      // ⚠️ 正在排队时别覆盖：状态栏那会儿显示的是「你排在第 N 位」
      if(!_queueTimer) setStatusText(_statusBase);
    }else throw 0;
  }catch(e){
    $("statusDot").className="dot off";
    $("statusLine").className="statusline off";
    _statusBase="助手 离线";
    setStatusText(_statusBase);
    _showStatus(true);           // ⭐ 离线必须显示（红字告警）
    setHsub(!!_admin ? "助手离线 · 内网离线 · 知识 — 篇" : "助手离线 · 知识 — 篇", "off");
  }
}

/* ========== 发送 ========== */
async function doSend(mode="free"){
  if(busy) return;
  // 「案例审查」是暗号不是提问：新标签页打开审查页，不打断当前会话，也不发给 AI
  const raw = input.value.trim();
  if(raw === "案例审查" || raw.replace(/\s+/g,"") === "案例审查"){
    input.value=""; autoGrow();
    window.open("/review","_blank");   // 走 /review（Cloudflare 静态资源会把 /review.html 307 到它）
    return;
  }
  /* 有待提交的日志附件 → **只随请求发走，不拼进输入框、不上屏**。
     ⚠️ 2026-11-07 主人反馈：原来是把日志全文拼进 input.value，结果整段日志被渲染进用户气泡，
        一屏全是日志、会话记录也被撑爆。
     现在拆成两份：
       · logPayload —— 跟着 question 发给后端（后端 _split_attached_log 仍能按「（附：…）」切开，
                       日志照旧只进模型、不进检索）
       · logNote    —— 只在气泡里留一行摘要，用户能确认"附件确实带上了" */
  let logPayload = "", logNote = "";
  if(_logAttach && _logAttach.text){
    // 说清"这是什么"，模型才不会把一段普通文本当成报错日志去解时间线
    const meta = _logAttach.win ? `（时间窗口：${_logAttach.win}）` : "";
    const label = _logAttach.kind === "zip"
      ? `（附：排查日志包 ${_logAttach.name}${meta}）`
      : _logAttach.kind === "txt"
        ? `（附：文本文件 ${_logAttach.name}${meta}）`
        : `（附：报错日志片段${meta}）`;
    logPayload = `${label}\n` + _logAttach.text;
    logNote = `📎 已附日志：${_logAttach.name} · 取 ${_logAttach.took}/${_logAttach.rows} 行`
            + (_logAttach.win ? ` · ${_logAttach.win}` : "");
    clearLogAttach();
  }
  let text = input.value.trim();
  // ⭐ 2026-10-27：**只发附件、不打字**也要能发出去（截图/日志扔进来就等回答，是最常见的用法）。
  //   后端 question 是必填（空串会 400）⇒ 这里补一句自然的话术当提问，别用「（无描述）」这种占位符，
  //   它会被当成正文进 prompt，读起来也别扭。
  const _hasImg = _chatImgs.length > 0 || (window._pendingImgs||[]).length > 0;
  if(!text && !_hasImg && !logPayload) return;
  if(!text) text = "请看这个附件，帮我看看是什么问题。";
  // 气泡里只显示「用户打的字 + 一行附件摘要」；日志正文只发给后端，不上屏
  const displayText = logNote ? `${text}\n\n${logNote}` : text;
  input.value=""; autoGrow(); $("sendBtn").disabled = busy = true;
  hideErr();

  // 报障卡带过来的截图：优先用服务端 id，上传没成功则用 base64 直传兜底
  // + 底部输入框里待发的图（2026-10-27）：两者合并后一起发，卡片优先在前。
  const imgs = (window._pendingImgs||[]).slice();
  window._pendingImgs = null;
  const chatImgs = _chatImgs.slice();
  imgs.push(...chatImgs);

  // ⚠️ 从建消息到收尾全部包进 try。渲染/存档一旦抛错，也必须走 finally 把 busy 放开 ——
  //    2026-09-16 事故：renderMsg 抛 ReferenceError 落在 try 之外 → busy 永久 true，
  //    页面表现成「点了没反应」＋「发送键永远点不动」。
  try{
    // 首条消息发出前，把首屏区（入口卡 / 报障卡）清掉 —— 否则它会一直挂在对话最上面
    _clearWelcomeZone();
    const userMsg = {role:"user", content:displayText, time:nowStr(), imgs, d:_dayKey()};
    thread.push(userMsg);
    // 图片已随本条消息带走 ⇒ 立刻清空待发区（否则下一轮会重复发送同一批图）
    _chatImgs = []; renderChatThumbs();
    renderMsg(userMsg); saveThread();

    typingNode();
    // history = 除最新一条外、**属于今天**的最近 HISTORY_ROUNDS 轮。
    // ⭐ 2026-10-28 跨天隔离：过了当天，旧记录只留作查看，不再进上下文；
    //    后端检索主 query / 日志证据都是从 history 里挑的，所以这一过滤就同时挡住了"旧问题带偏检索"。
    const _today = _dayKey();
    const histMsg = thread.slice(0,-1)
      .filter(m => (m.d || (m.ts ? _dayKey(m.ts) : null)) === _today);
    const history = histMsg.slice(-HISTORY_ROUNDS*2).filter(m=>m.role!=="welcome").map(m=>({role:m.role, content:m.content}));
    // 排队用：rid 必须在**发请求前**生成，这样等待期间就能查到自己排第几
    const rid = newRid();
    const _est = estimateWait(text);
    if(_est >= 30){ setStatusText(`正在处理，预计约 ${_est} 秒（视任务规模）…`); _showStatus(true); }
    startQueuePoll(rid);
    const r = await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({question:(logPayload ? `${text}\n\n${logPayload}` : text), history, mode, rid,
                            images: imgs.map(im=>im.id||im.data).filter(Boolean)}),
      signal: AbortSignal.timeout(240000)
    });
    const j = await r.json().catch(()=>({}));
    $("typingMsg")&&$("typingMsg").remove(); stopWaitHints(); stopQueuePoll();
    if(r.status===401){
      // 访问验证失效（令牌到期 / 换了浏览器 / 被清 Cookie）—— 网关这时回的是登录页 HTML，
      // 直接说清"刷新即可重新验证"，比笼统报「请求失败(401)」有用得多。
      thread.push({role:"assistant", time:nowStr(), d:_dayKey(),
        content:"🔐 **访问验证已失效**（设备令牌到期，或换了浏览器 / 清了 Cookie）。刷新页面重新验证即可，这段对话不会丢。"});
    }else if(r.status===503 || j.status==="offline"){
      thread.push({role:"assistant", time:nowStr(), d:_dayKey(), content:"⚠️ 本机 AI 服务当前不在线（可能关机/断网/未启动），请稍后再试，或联系运维确认本机状态。"});
    }else if(!r.ok){
      thread.push({role:"assistant", time:nowStr(), d:_dayKey(), content:`⚠️ 请求失败（${r.status}）：${j.detail||j.message||"请稍后重试"}`});
    }else if(j.queued_out){
      // 排队等待超上限（后端快速回绝，带位次与人话）—— 正常渲染答案气泡即可，
      // 但**不当作案例收录**（这是排队信息不是回答，混进 cases 会污染质量信号）。
      thread.push({role:"assistant", time:nowStr(), d:_dayKey(), content:j.answer||"(排队超限)", cid:newCid(), ts:Date.now(), verdict:""});
    }else{
      // 每条回答都带一个案例号：用户点按钮、或日后在审查页处理，都靠它对上号
      const am = {role:"assistant", time:nowStr(), d:_dayKey(), content:j.answer||"(空回答)",
                  sources:j.sources||[], code:j.code_sources||[],
                  diagram:j.diagram||null,   // 简图 {kind,title,url}，渲染在气泡最上方
                  user:j.user||"",           // 谁在用（网关注入的身份，用于使用统计）
                  cid:newCid(), ts:Date.now(), verdict:""};
      thread.push(am);
      reportCase(am,"ask");   // 自动收录：没被点评的案例也应出现在审查页
    }
    renderMsg(thread[thread.length-1]);
    saveThread();
  }catch(e){
    $("typingMsg")&&$("typingMsg").remove(); stopWaitHints(); stopQueuePoll();
    showErr(e.name==="TimeoutError"
      ? "这次处理超过 240 秒，已自动停止。可以直接再点一次发送重试；若仍超时，补充关键信息（POS 单号 / 商场店铺 / 报错截图）或把日志缩小到出问题的那几分钟，会快很多。"
      : ("请求失败："+(e.message||e)));
  }finally{
    stopQueuePoll();   // 兜底：无论成功失败都停掉轮询，避免定时器泄漏
    // ⚠️ 这里不能写死 false：等待期间用户可能又打了字，按钮可用性要跟输入框保持一致
    busy=false; refreshSendBtn(); input.focus();
    syncSession();   // 静默同步到服务端：换台电脑能接着看。内部已吞掉所有异常，不影响主流程
  }
}

/* ========== 输入区交互 ========== */
function autoGrow(){ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,150)+"px"; }
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); doSend(); }
});
// ⚠️ 不能直接写 `addEventListener("click", doSend)` —— 那样 Event 会被当成第一个参数（mode）传进去
$("sendBtn").addEventListener("click", ()=>doSend("free"));
/* 开始新一次报障 —— 自由聊天模式里的「📝 报障」用这一份：
   清空当前对话 + 上一单的临时状态 → 切到报障模式并弹出信息卡。 */
async function startNewReport(){
  if(thread.length && !(await confirmBox("开始新一次报障？当前这段对话会被清空（清空后无法找回）。", "开始新报障", "取消"))) return;
  thread=[]; picked.clear(); localStorage.removeItem(LS_KEY);
  _cardImgs=[]; window._pendingImgs=null;
  _logBusy=false; clearLogAttach();          // 上一单的日志不能带进新一次报障
  _timeEditing=false; setReportTime("");     // 新一次报障 = 新的事故时间，一并清掉
  saveSid("");                               // 新会话 = 新 ID（下次发送时由服务端重新分配）
  _entryMode="report";                       // 切到报障模式
  renderThread(); input.focus();
}

/* 「🗑 清空对话」—— 只清当前这段对话、**保持当前模式**，不弹报障卡。
   ⚠️ 与「📝 报障」的区别：那个会切到报障模式并弹出信息卡，这个只是清空。
   （2026-09-24 主人定：这个按钮原先是「＋ 新报障」，与「📝 报障」功能重复，现改为专用清空。） */
async function clearConversation(){
  if(!thread.length){ showToast("当前没有对话可清空","ok"); return; }
  if(!(await confirmBox("清空当前这段对话？清空后无法找回。", "清空", "取消"))) return;
  thread=[]; picked.clear(); localStorage.removeItem(LS_KEY);
  _cardImgs=[]; window._pendingImgs=null;
  _logBusy=false; clearLogAttach();
  _timeEditing=false; setReportTime("");
  saveSid("");
  // ⚠️ _entryMode 保持不变：报障模式回到空卡片、自由模式回到空白，都不切模式
  renderThread(); input.focus();
  showToast("已清空对话","ok");
}
$("reportBtn").addEventListener("click", startNewReport);      // 跳新会话 + 弹报障卡
$("newChatBtn").addEventListener("click", clearConversation);  // 只清空对话，不切模式

/* 「❓ 能做什么」弹层（2026-10-28）：替代原「其他」入口。
   ⚠️ 点遮罩 / 右上角 ✕ / Esc 都能关；打开时不允许背景滚动穿透。 */
function openHelp(){ $("helpMask").classList.add("show"); }
function closeHelp(){ $("helpMask").classList.remove("show"); }
$("helpBtn").addEventListener("click", openHelp);
$("helpClose").addEventListener("click", closeHelp);
$("helpMask").addEventListener("click", e=>{ if(e.target === $("helpMask")) closeHelp(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeHelp(); });
function showErr(t){ const el=$("errline"); el.textContent="⚠️ "+t; el.style.display="block"; }
function hideErr(){ $("errline").style.display="none"; }

/* ===== 日志文件：按「发生时间」±1 小时截取 =====
   ⚠️ 不限制文件大小：大日志靠「发生时间 ±1h」收窄，而不是拒收。
   时间不来自独立字段，就是报障卡那个「发生时间」（_reportTime 是全页唯一来源）；
   未填则拦下并要求填写。流程：点「附加日志文件」→ 校验时间 → 选中文件后按时间窗筛选 →
   带时间戳的行保留，无时间戳的续行（堆栈/报文）跟随上一行 → 结果随下一条消息发出。 */
const LOG_WINDOW_MS = 60*60*1000;   // 前后各 1 小时
const LOG_MAX_CHARS = 100000;       // 截取后仍超长时的安全上限（优先保留离事发点最近的）
/* 日志包（zip）：一线常直接甩 `<SN>_<YYYY-MM-DD>.zip` 过来，里面是
   `YYYY-MM-DD.txt`（POS）+ 可选的 `bankposMMDD.txt`（嘉利）。
   解压在后端做（Python 标准库，可控防 zip bomb），前端只拿全文、仍按下面同一套时间窗截取。 */
const LOG_ZIP_MAX_MB = ATTACH_MAX_BYTES / 1024 / 1024;   // 与图片/txt 统一 5MB
const isZipFile = f => /\.zip$/i.test(f.name||"") || /zip/i.test(f.type||"");
const fileToDataUrl = f => new Promise((res, rej)=>{
  const fr = new FileReader();
  fr.onload = () => res(fr.result);
  fr.onerror = () => rej(new Error("文件读取失败，请重试"));
  fr.readAsDataURL(f);
});
const fmtTs = d => `${_p2(d.getMonth()+1)}-${_p2(d.getDate())} ${_p2(d.getHours())}:${_p2(d.getMinutes())}`;
const fmtKB = n => n>=1024*1024 ? (n/1024/1024).toFixed(1)+"MB" : Math.max(1,Math.round(n/1024))+"KB";

/* ---------- 日志附件：一份状态，两个槽位 ----------
   日志有两个入口（报障卡里挨着「添加截图」、footer 的「📎 附加排查日志」），但状态只有一份。
   ⚠️ 渲染必须遍历全部槽位，否则会出现「卡里显示了、底部没显示」的不一致。
   以前这里只是个 <span class="fname"> 文本，用户看不到「已收下」、也没法撤销 —— 改成卡片。 */
let _logBusy = false;       // 正在读文件 / 截取（大日志要一两秒，这期间给明确的进行中态）
let _logSyncT = null;       // 输入时间时的防抖句柄（见 renderWelcome 里 fTime 的监听）
function logSlots(){ return [$("logSlotCard"), $("logSlotFoot")].filter(Boolean); }
function clearLogAttach(){
  _logAttach = null; _pendingLogFile = null;
  logSlots().forEach(s=>{ s.innerHTML = ""; });
}
function renderLogAttach(){
  const slots = logSlots();
  let html = "";
  if(_logBusy){
    html = `<div class="attach wait">
      <span class="ico"><span class="spin"></span></span>
      <div class="info"><div class="nm">正在读取并截取日志…</div>

/* 解析一行里的时间戳；识别不到返回 null（该行继承上一行的时间） */
function parseLogTs(line, base){
  let m = line.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})[ T](\d{1,2}):(\d{2}):(\d{2})/);
  if(m){ const h=+m[4],mi=+m[5],s=+m[6]; if(h<=23&&mi<=59&&s<=59) return new Date(+m[1],+m[2]-1,+m[3],h,mi,s); }
  // logcat 风格：09-14 14:30:12.345 （无年份，按用户填的时间取年）
  m = line.match(/(?:^|[^\d])(\d{1,2})[-/](\d{1,2})\s+(\d{1,2}):(\d{2}):(\d{2})/);
  if(m){ const h=+m[3],mi=+m[4],s=+m[5]; if(h<=23&&mi<=59&&s<=59) return new Date(base.getFullYear(),+m[1]-1,+m[2],h,mi,s); }
  // 只有时间：14:30:12 或 [14:30:12]
  m = line.match(/(?:^|[^\d:])(\d{1,2}):(\d{2}):(\d{2})(?:[.,]\d+)?/);
  if(m){ const h=+m[1],mi=+m[2],s=+m[3]; if(h<=23&&mi<=59&&s<=59) return new Date(base.getFullYear(),base.getMonth(),base.getDate(),h,mi,s); }
  return null;
}
function sliceLogByTime(text, center){
  const lo=center.getTime()-LOG_WINDOW_MS, hi=center.getTime()+LOG_WINDOW_MS;
  const rows=text.split(/\r?\n/); const kept=[]; let cur=null, stamped=0;
  for(const ln of rows){
    const ts=parseLogTs(ln, center);
    if(ts){ stamped++; cur=ts; } else if(cur===null){ continue; }  // 首个时间戳之前的前言丢弃
    if(cur<lo || cur>hi) continue;
    kept.push(ln);
  }
  return {rows:rows.length, kept, stamped};
}
/* 仍超长时：从离事发时间点最远的一端开始丢，保证中间那段（事发前后）留下。
   maxChars 可覆盖全局上限（autoTail 模式给每份单独限额时用）。 */
function trimLog(lines, center, maxChars){
  const limit = maxChars || LOG_MAX_CHARS;
  let text=lines.join("\n");
  if(text.length<=limit) return {text, trimmed:0};
  const offs=[]; let cur=center;
  for(const ln of lines){ const ts=parseLogTs(ln, center); if(ts) cur=ts; offs.push(Math.abs(cur.getTime()-center.getTime())); }
  let a=0,b=lines.length-1,chars=text.length;
  while(chars>limit && a<=b){
    if(offs[a]>=offs[b]){ chars-=lines[a].length+1; a++; } else { chars-=lines[b].length+1; b--; }
  }
  const kept=lines.slice(a,b+1);
  return {text:kept.join("\n"), trimmed:lines.length-kept.length};
}
/* 对「一份」日志文本做截取，返回正文与统计。
   - 默认：按「发生时间 ±1 小时」精确切；
   - wholeLog=true（主对话传 zip 且没填时间时的兜底）：不切时间窗，整份给，
     超长则从**最早**的一端丢（保末尾）—— 报障通常就是刚才发生的事。
   ⚠️ zip 里多份文件要各自切：两份时间戳格式不同（POS `09:01:22,536`，嘉利
   `09:01:22.154`），先拼再切的话，无时间戳的分隔行会继承上一份末行时间，边界就错了。 */
function sliceOneLog(text, center, opts){
  opts = opts || {};
  const lines = text.split(/\r?\n/);
  if(opts.wholeLog){
    const tr = trimLog(lines, center, opts.budget);
    return {text:tr.text, took:lines.length-tr.trimmed, rows:lines.length,
            stamped:0, trimmed:tr.trimmed, hit:true,
            note:"未填发生时间，已附整份"};
  }
  const sl = sliceLogByTime(text, center);
  if(sl.stamped === 0){
    const tr = trimLog(lines, center, opts.budget);
    return {text:tr.text, took:sl.rows-tr.trimmed, rows:sl.rows, stamped:0,
            trimmed:tr.trimmed, hit:true, note:"未识别到时间戳，已整份保留"};
  }
  if(!sl.kept.length){
    return {text:"", took:0, rows:sl.rows, stamped:sl.stamped, trimmed:0, hit:false, note:""};
  }
  const tr = trimLog(sl.kept, center, opts.budget);
  return {text:tr.text, took:sl.kept.length-tr.trimmed, rows:sl.rows,
          stamped:sl.stamped, trimmed:tr.trimmed, hit:true, note:""};
}
/* 取「日志里最后一条时间戳」：主对话传 zip 时用户可能没填发生时间，
   用日志末尾当基准（刚出问题就贴日志过来是最常见的用法）。
   只扫每个文件的末尾 800 行 —— 日志基本按时间顺序写，倒着找最快。 */
function lastLogTs(parts){
  for(const p of (parts||[])){
    const lines = (p.text||"").split(/\r?\n/);
    const from = Math.max(0, lines.length - 800);
    for(let i = lines.length - 1; i >= from; i--){
      const t = parseLogTs(lines[i], new Date());
      if(t && !isNaN(t.getTime())) return t;
    }
  }
  return null;
}

function markLogTimeMissing(){

/* 按「发生时间」前后 1 小时截取这份日志。选文件当下若还没填时间也不会丢：
   文件先存进 _pendingLogFile，用户填完卡里的「⑥ 发生时间」后（见 fTime 的监听）会带它再调一次。 */
async function ingestLogFile(f, cached, opts){
  opts = opts || {};
  let center=new Date(_reportTime);
  const noTime = isNaN(center.getTime());
  // 两个入口（报障卡 / 主对话）口径已统一：没填时间就拦下要求填 —— 截取基准只能由用户给。
  // ⚠️ 2026-11-07：原「主对话没时间就自动取日志末尾」的分支已停用（opts.autoTail 现无调用方），
  //    因为报障延迟时它会切到错误的一段、漏掉真正出问题的时间；参数保留以兼容旧调用。
  if(noTime && !opts.autoTail){ _pendingLogFile=f; renderLogAttach(); return markLogTimeMissing(); }
  _logBusy=true; renderLogAttach();

  /* ① 取「待截取文本」：普通文件一份；zip 交给后端解开、拿回多份。
     cached 是上次解压的结果 —— 用户回头改「发生时间」时直接复用，不必重复上传解压。 */
  let parts, zipMeta=null;

    parts = cached;
  }else{
    try{
      if(isZipFile(f)){
        if((f.size||0) > LOG_ZIP_MAX_MB*1024*1024){
          throw new Error(`日志包超过 ${LOG_ZIP_MAX_MB}MB，请拆分后再传`);
        }
        const dataUrl = await fileToDataUrl(f);
        const r = await fetch("/upload-zip", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({dataUrl, name:f.name}),
          signal: AbortSignal.timeout(60000)
        });
        const j = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(j.detail || `日志包解压失败（HTTP ${r.status}）`);
        const fs = j.files || [];
        if(!fs.length) throw new Error("日志包里没有可读的文本文件");
        parts = fs.map(x=>({name:x.name, label:x.label||"", text:x.text}));
        zipMeta = {sn:j.sn||"", date:j.date||""};
      }else{
        parts = [{name:f.name||"日志", label:"", text: await f.text()}];
      }
    }catch(err){
      _logBusy=false; renderLogAttach();
      showErr((err && err.message) ? err.message : "日志读取失败，请重试或直接粘贴关键片段");
      return;
    }
  }

  /* ② 没填发生时间（仅主对话入口）→ 取日志末尾当基准，并改成「整份给、超长保末尾」
     ⚠️ 不能沿用「末尾 ±1 小时」：实测一包日志末尾是 10:24，那窗口只覆盖 10:15~10:24，
        反而把用户真正关心的 09:01 那笔交易切掉了。整份给更安全。 */
  let wholeLog = false;
  if(noTime){
    center = lastLogTs(parts) || new Date();
    wholeLog = true;
  }

  /* ③ 每份独立截取。整份模式下按份数平分总预算，避免两份加起来顶爆 10 万字符 */
  const budget = wholeLog ? Math.floor(LOG_MAX_CHARS / Math.max(1, parts.length)) : 0;
  const res = parts.map(p=>Object.assign({}, p,
      sliceOneLog(p.text, center, {wholeLog, budget: budget || undefined})));

    return;
  }

  /* ④ 合并：单份无标签 → 原样；多份/带标签 → 加分隔标题，让模型分得清哪个程序的日志 */
  const multi = kept.length > 1 || kept.some(r=>r.label);
  // 标题里带上「仅末尾 x/y 行」：否则模型会把「没搜到某笔交易」误判成「这笔没发生」
  const body = multi
    ? kept.map(r=>`===== ${r.label||"日志"}（${r.name}${r.trimmed?`，仅末尾 ${r.took}/${r.rows} 行`:""}）=====\n${r.text}`).join("\n\n")
    : kept[0].text;

  const rows    = res.reduce((a,b)=>a+b.rows,0);
  const took    = kept.reduce((a,b)=>a+b.took,0);
  const trimmed = kept.reduce((a,b)=>a+b.trimmed,0);
  const noTs    = kept.some(r=>r.stamped===0);
  const detail  = multi
    ? kept.map(r=>`${r.label||r.name} ${r.rows}行`).join(" + ") + "；"
    : "";

  let note;
  if(wholeLog) note = trimmed
    ? `未填发生时间，日志过长只附末尾 ${took} 行（填「发生时间」可精确定位到具体那笔）`
    : "未填发生时间，已附整份日志";
  else if(noTs) note = "部分日志无时间戳，已整份保留";
  else note = `已按 ${fmtTs(center)} 前后 1 小时截取`;
  if(trimmed && !wholeLog) note += `，过长部分已丢弃 ${trimmed} 行`;
  if(zipMeta && zipMeta.sn) note = `${zipMeta.sn} ${zipMeta.date}｜` + note;

  _logBusy=false;
  _logAttach={ name:f.name||"日志", size:f.size||body.length,
               kind: isZipFile(f) ? "zip" : "log",
               win: wholeLog ? "" : (noTs ? `${fmtTs(center)} 前后 1 小时（部分日志无时间戳，未能按时间截取）`
                                          : `${fmtTs(center)} 前后 1 小时`),
               note, detail, text:body, took, rows,
               _parts: parts,
               file:f };   // 留着原文件：用户回头改「发生时间」时按新窗口重截，不必重新选一次
  renderLogAttach();
  hideErr();
}
