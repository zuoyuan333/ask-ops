<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="uFI1SRQ5SEYBKd4geMH2uL">

<title>AskOps · AI 运维助手</title>
<!-- favicon（2026-10-28 主人选定：蓝色 POS 图标）：ICO + 多尺寸 PNG -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#2563EB">
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0;
    --brand:#2563eb; --brand-d:#1d4ed8; --brand-soft:#eff6ff;
    --text:#0f172a; --muted:#64748b;
    --ok:#16a34a; --bad:#ef4444; --warn:#d97706;
    --ai-bg:#f8fafc; --user-bg:#2563eb;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#eef4ff 0%,var(--bg) 45%);
    color:var(--text); display:flex; flex-direction:column;
  }
  /* ---------- 顶栏 ---------- */
  header{
    flex:none; display:flex; align-items:center; gap:12px;
    padding:14px 18px 10px; max-width:860px; width:100%; margin:0 auto;
  }
  .logo{
    width:40px;height:40px;border-radius:11px;flex:none;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-size:21px; box-shadow:0 4px 12px rgba(37,99,235,.25);
  }
  /* ---------- 页头：标题 + talkID（2026-09-27 主人三次调整后，工具按钮已全部下移到底部） ---------- */
  .hwrap{flex:1; min-width:0; display:flex; flex-direction:column}
  .hmain{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  /* 底部操作行：复制给人工（有对话才显示）+ 继续会话 / 报障 / 管理 / 清空对话，同一行 */
  .bottombar{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap}
  h1{font-size:18px; font-weight:700; line-height:1.25; display:flex; align-items:baseline; gap:5px; flex-wrap:wrap}
  /* 副标题 = **实时状态行**（2026-10-23 主人要求改版）。
     ⚠️ 原来是静态文案「对话式排障 · 缺信息会追问 · 请控制好输入条件…」，
        主人要求换成「AI在线 · 内网在线 · 知识 N 篇」，由 checkHealth() 每 60 秒刷新。
     三态配色：全绿=AI 与内网都正常；黄=AI 正常但内网通道离线（能问答、查不了终端数据）；
              红=AI 本身不可用。点不点得动都无所谓，它只是状态展示。 */
  .hsub{
    display:flex; align-items:center; gap:6px;
    font-size:13.5px; color:#0f172a; font-weight:500; margin-top:2px;
    font-variant-numeric:tabular-nums;
  }
  .hsub .hdot{width:7px;height:7px;border-radius:50%;background:#cbd5e1;flex:none;transition:.2s}
  .hsub.on .hdot{background:var(--ok); box-shadow:0 0 0 3px rgba(22,163,74,.18)}
  .hsub.partial .hdot{background:var(--warn); box-shadow:0 0 0 3px rgba(217,119,6,.18)}
  .hsub.off .hdot{background:var(--bad); box-shadow:0 0 0 3px rgba(239,68,68,.15)}
  .hsub.off{color:#b91c1c}
  /* 会话 ID（talkID）：贴在标题右后方，等宽字体更易辨认；点一下复制 */
  .talkid{
    border:0;background:transparent;padding:0;cursor:pointer;
    font-size:11.5px;font-weight:400;color:var(--muted);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .talkid:hover{color:var(--brand);text-decoration:underline}
  /* 服务状态行。
     ⚠️ 2026-10-23 主人要求：**正常时不再显示**「AI 在线 · 知识 N 段 · 数据在线」那一行。
        但它还承担三种**必须保留**的提示，所以做成「默认隐藏、有事才出现」：
          · 离线 → 红字告警（本机没开机要让人知道）
          · 排队 → 「你排在第 N 位」
          · 处理中 → 「正在处理，预计约 N 秒…」
        实现：默认 display:none，由 JS 按需切 .show；见 checkHealth/_queueTick。
     ⚠️ 别把这一段整个删掉 —— 删了「AI 离线」就没提示，用户只会觉得"点了没反应"。 */
  .statusline{
    display:none; align-items:center; gap:7px; margin-top:7px;
    font-size:13.5px; font-weight:500; color:#0f172a; white-space:nowrap;
  }
  .statusline.show{display:flex}
  .statusline.on{color:var(--ok)}
  .statusline.off{
    color:var(--bad); font-size:15px; font-weight:700; white-space:normal;
    background:#fef2f2; border:1px solid #fecaca; border-radius:9px;
    padding:7px 12px; margin-top:9px; width:max-content; max-width:100%;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1}
  .dot.on{background:var(--ok); box-shadow:0 0 0 3px rgba(22,163,74,.18)}
  .dot.off{background:var(--bad); box-shadow:0 0 0 3px rgba(239,68,68,.15)}
  .icon-btn{
    border:1px solid var(--line);background:#fff;color:var(--muted);
    border-radius:9px;padding:6px 11px;font-size:12.5px;cursor:pointer;transition:.15s;
    display:inline-flex;align-items:center;gap:5px;box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .icon-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
  /* 禁用态（2026-09-24）：「🗑 清空对话」在没有对话时置灰，避免点了没反应 */
  .icon-btn:disabled,.icon-btn:disabled:hover{
    opacity:.4;cursor:not-allowed;border-color:var(--line);color:var(--muted);
    background:#fff;box-shadow:none}
  /* ---------- 消息区 ----------
     ⚠️ 2026-10-23 主人要求：中间对话区要有**白色卡片背景**。
        原来只有 body 的浅色渐变，消息气泡和背景糊在一起、看不出"这是一块对话区"。
        做法：左右留白从 .feed 移到 main（窄屏才不会被卡片顶到边），
        .feed 自己变成白底圆角卡片；空的时候（自由聊天模式首屏）整块隐藏，
        免得留一条空白色条。 */
  main{
    flex:1; overflow-y:auto; padding:10px 14px 18px;
    scroll-behavior:smooth;
  }
  .feed{
    max-width:860px; width:100%; margin:0 auto; padding:16px 14px;
    display:flex; flex-direction:column; gap:14px;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 4px 18px rgba(15,23,42,.05);
  }
  .feed:empty{display:none}
  /* 勾选框常驻在消息行的最外侧（助手在左、用户在右），随气泡一起滚动 */
  .msg{display:flex; gap:10px; animation:fadeIn .22s ease; position:relative; padding-left:24px}
  .msg.user{flex-direction:row-reverse; padding-left:0; padding-right:24px}
  .pick{
    position:absolute; top:8px; left:0; width:16px; height:16px; margin:0;
    accent-color:var(--brand); cursor:pointer; flex:none;
  }
  .msg.user .pick{left:auto; right:0}
  /* 2026-11-02：没勾选就点「复制给人工」时，让勾选框闪一下，明确告诉用户点哪儿 */
  @keyframes pickPulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,0)} 50%{box-shadow:0 0 0 7px rgba(37,99,235,.28)}}
  .pick.hint{outline:2px solid #2563eb; outline-offset:2px; border-radius:3px; animation:pickPulse 1.1s ease 2}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
  .msg .avatar{
    width:32px;height:32px;border-radius:9px;flex:none;margin-top:2px;
    display:flex;align-items:center;justify-content:center;font-size:16px;
  }
  .msg.ai .avatar{background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff}
  .msg.user{flex-direction:row-reverse}
  .msg.user .avatar{background:#e2e8f0; color:#334155}
  /* ⚠️ 2026-09-27 主人报「输入 hello 被折成 he/lo」—— 根因：原 .bubble{max-width:78%} 的百分比
     基准是外层 wrapper，而 wrapper 是 shrink-to-fit（宽度=内容宽）；短文本时 78%×内容宽 < 内容宽
     → 反而把内容压到折行（长文本时 wrapper 接近满宽，所以一直没暴露）。
     修法：wrapper 固定为 .msg-body（flex:1 占满剩余宽度 → 百分比基准变成确定值），
     气泡改 width:fit-content → 短消息贴合内容、长消息最多 78% 不错行；用户侧整体右对齐。 */
  .msg-body{flex:1 1 auto; min-width:0}
  .msg.user .msg-body{display:flex; flex-direction:column; align-items:flex-end}
  .bubble{
    width:fit-content; max-width:78%; padding:11px 14px; border-radius:13px; font-size:14px; line-height:1.7;
    word-break:break-word; white-space:pre-wrap;
    box-shadow:0 1px 3px rgba(15,23,42,.05);
  }
  .msg.ai .bubble{background:var(--ai-bg); border:1px solid var(--line); border-top-left-radius:4px}
  .msg.user .bubble{background:var(--user-bg); color:#fff; border-top-right-radius:4px; user-select:text}
  .msg .meta{font-size:11px;color:#94a3b8;margin-top:4px; padding:0 2px}
  .msg.user .meta{text-align:right}
  /* 回答简图（tools.draw_diagram）：白底卡片插在正文前，先看图再读字。
     图自带白底 / 边框 / 圆角（后端模板产出），这里不再加边框，免得套两层。 */
  .diagwrap{margin:0 0 10px}
  .diagwrap img,.diagwrap svg{display:block; width:100%; height:auto; border-radius:12px}
  /* markdown 在气泡内 */
  .bubble b,.bubble strong{color:inherit}
  .msg.ai .bubble b,.msg.ai .bubble strong{color:#0f172a}
  .bubble code{
    background:rgba(37,99,235,.07); border:1px solid var(--line); border-radius:5px;
    padding:1px 6px; font-size:12.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .msg.user .bubble code{background:rgba(255,255,255,.15); border-color:rgba(255,255,255,.25)}
  .bubble pre{
    background:#0f172a;color:#e2e8f0;border-radius:9px;padding:12px;overflow-x:auto;
    font-size:12.5px;line-height:1.6;margin:8px 0;white-space:pre-wrap;word-break:break-all;
  }
  .msg.user .bubble pre{background:rgba(15,23,42,.25)}
  .bubble pre code{background:none;border:0;color:inherit;padding:0}
  .bubble ul,.bubble ol{margin:4px 0 4px 18px}
  .bubble li{margin:2px 0}
  /* 分隔线（答案里单独一行的 `---`）。
     ⚠️ 2026-10-26：原来渲染成**一个空字符串**，等于凭空多一个空行（就是主人报的「各种换行」之一）。
        现在渲染成一条细线，高度自己撑住、不再靠空行。 */
  .bubble .hr{border-top:1px solid var(--line);margin:6px 0;height:0}
  /* markdown 表格：助手按「编码/参数对照优先表格」输出，渲染成真表格才看得清 */
  .md-tbl{
    /* 2026-10-23 主人报「表格下面多一个空行」：
       答案文本侧已经没空行（_strip_blank_lines 把连续换行压成一个），
       那个"空行"是这里的 8px 上下外边距在视觉上撑出来的。⇒ 压到 3px。 */
    border-collapse:collapse;margin:3px 0;font-size:12.5px;line-height:1.5;
    background:#fff;border:1px solid var(--line);max-width:100%;
  }
  .md-tbl th,.md-tbl td{
    border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top;
    white-space:normal;word-break:break-word;
  }
  .md-tbl th{background:#f1f5f9;font-weight:600;color:#334155}
  .md-tbl tr:nth-child(even) td{background:#fafbfc}
  .md-tbl td code{white-space:pre-wrap;word-break:break-all;font-size:12px}
  /* 表格后紧跟的正文贴紧，避免又出现「空行」的观感 */
  .md-tbl + div{margin-top:0}
  .msg.user .bubble .md-tbl{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
  .msg.user .bubble .md-tbl th,.msg.user .bubble .md-tbl td{border-color:rgba(255,255,255,.3)}
  .msg.user .bubble .md-tbl th{background:rgba(255,255,255,.16);color:#fff}
  .src-tag{
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);
    background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 7px;margin:1px 3px 0 0;
  }
  .src-line{display:block;margin-top:8px;font-size:11.5px;color:#94a3b8}
  /* AI 回答下方的结论按钮：一次点击就是一条「这个答案管不管用」的免费信号 */
  .verdict{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
  .vbtn{
    border:1px solid var(--line);background:#fff;color:#475569;border-radius:8px;
    padding:4px 11px;font-size:12.5px;cursor:pointer;transition:.15s;line-height:1.5;font-family:inherit;
  }
  .vbtn:hover{border-color:#93c5fd;background:#f8fbff}
  .vbtn.on-ok{background:#ecfdf5;border-color:#86efac;color:#15803d;font-weight:600}
  .vbtn.on-bad{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;font-weight:600}
  /* 2026-10-23 主人要求突出这段字：
     原来是一行 11.5px 浅灰小字（#94a3b8），跟按钮挤在一起没人注意到，
     而那正是收集「这答案管不管用」的唯一入口。⇒ 红字 + 加粗 + 浅红底。 */
  .vnote{
    font-size:12px;color:#dc2626;font-weight:600;
    background:#fef2f2;border:1px solid #fecaca;border-radius:7px;
    padding:3px 9px;line-height:1.5;
  }
  /* 标过之后就不再喊了，换低调灰，避免一直刺眼 */
  .vnote.done{color:#475569;font-weight:500;background:#f8fafc;border-color:var(--line)}
  .typing{display:inline-flex;gap:4px;align-items:center;padding:4px 2px}
  .typing i{width:6px;height:6px;border-radius:50%;background:#94a3b8;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  /* 首屏引导 */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{
    border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:999px;
    padding:6px 12px;font-size:12.5px;cursor:pointer;transition:.15s;line-height:1.4;
  }
  .chip:hover{background:#dbeafe;border-color:#93c5fd}
  /* ---------- 首屏空态：报障主按钮 + 能力说明（2026-10-28 重构）----------
     主人定：不再用「报障 / 其他」两张平分秋色的卡 —— 回访用户根本没入口，
     且「其他」价值不大，不如换成一句「我能帮你做什么」的能力说明。
     现在：一个主 CTA（报障）+ 一段能力描述 + 一排示例 chip（点了填进输入框，不直接发）。 */
  .entry{margin:6px 0 2px}
  .entry-head{font-size:15px;font-weight:700;color:var(--text)}
  .entry-sub{font-size:12px;color:var(--muted);line-height:1.6;margin-top:5px}
  .entry-line{margin-top:0;font-size:12.5px;line-height:1.7;color:#334155}
  .entry-line b{color:var(--text);font-weight:700;margin-right:2px}
  .entry-cta{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    margin-top:14px;padding:11px 20px;border:0;border-radius:11px;
    background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;
    font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer;
    box-shadow:0 4px 14px rgba(37,99,235,.28);transition:.15s;
  }
  .entry-cta:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(37,99,235,.34)}
  .entry-caps{
    margin-top:14px;padding:12px 14px;border:1px solid var(--line);
    border-radius:12px;background:#f8fafc;
  }
  .entry-caps h4{margin:0 0 5px;font-size:12.5px;font-weight:700;color:#334155}
  .entry-caps p{margin:0;font-size:12px;line-height:1.7;color:var(--muted)}
  .entry-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  @media (max-width:560px){ .entry-cta{width:100%} }

  /* ---------- 「能做什么」说明弹层（回访用户也能随时看） ---------- */
  .help-mask{
    position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:300;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .help-mask.show{display:flex}
  .help-card{
    width:min(520px,100%);max-height:80vh;overflow:auto;background:#fff;
    border-radius:16px;padding:18px 18px 16px;box-shadow:0 18px 48px rgba(15,23,42,.28);
    animation:fadeIn .18s ease;
  }
  .help-card h3{margin:0 0 10px;font-size:16px;color:var(--text)}
  .help-card h4{margin:14px 0 5px;font-size:12.5px;font-weight:700;color:#334155}
  .help-card p{margin:0;font-size:12.5px;line-height:1.75;color:#475569}
  .help-card .help-close{
    float:right;border:0;background:transparent;color:#94a3b8;font-size:18px;
    line-height:1;cursor:pointer;padding:0 4px;border-radius:6px;
  }
  .help-card .help-close:hover{background:#fef2f2;color:#ef4444}

  /* ---------- 居中确认框（2026-10-28）----------
     替代浏览器原生 confirm：原生弹窗贴在窗口顶部（Chrome 的"此页面 says"条），
     鼠标要往上跑一大段，样式也不统一。改成和「能做什么」同一套居中弹层。 */
  .cfm-mask{
    position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:320;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .cfm-mask.show{display:flex}
  .cfm-card{
    width:min(380px,100%);background:#fff;border-radius:14px;padding:20px 20px 16px;
    box-shadow:0 18px 48px rgba(15,23,42,.28);animation:fadeIn .16s ease;
  }
  .cfm-text{margin:0 0 18px;font-size:14px;line-height:1.7;color:var(--text);white-space:pre-wrap}
  .cfm-btns{display:flex;justify-content:flex-end;gap:10px}
  .cfm-btn{
    border:1px solid var(--line);background:#fff;color:#475569;border-radius:9px;
    padding:8px 18px;font-size:13.5px;font-family:inherit;cursor:pointer;transition:.15s;
  }
  .cfm-btn:hover{background:#f8fafc}
  .cfm-btn.primary{
    background:linear-gradient(135deg,#3b82f6,#2563eb);border-color:transparent;color:#fff;
    font-weight:600;box-shadow:0 3px 10px rgba(37,99,235,.24);
  }
  .cfm-btn.primary:hover{transform:translateY(-1px)}

  /* ---------- 居中输入框（2026-10-28）：替代原生 prompt（「继续会话」输会话 ID）---------- */
  .inp-mask{
    position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:320;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .inp-mask.show{display:flex}
  .inp-card{
    width:min(420px,100%);background:#fff;border-radius:14px;padding:20px 20px 16px;
    box-shadow:0 18px 48px rgba(15,23,42,.28);animation:fadeIn .16s ease;
  }
  .inp-title{margin:0 0 10px;font-size:14px;line-height:1.6;color:var(--text)}
  .inp-field{

<script>
/* ===== 老浏览器兼容垫片（2026-11-02）=====
   起因：用户反馈「非 Chrome 浏览器验证通过后进不了助手」。
   本页用了 20+ 处 `AbortSignal.timeout(ms)`，而它是 **Safari 16.4 / Firefox 100 才有的**，
   更老的浏览器里每调一次就抛 `TypeError: AbortSignal.timeout is not a function`，
   而很多调用点在事件回调里 ⇒ 表现为「按钮点了没反应 / 页面卡住」。
   `crypto.randomUUID` 同理（Safari 15.4+、且非 HTTPS 下不存在）。
   垫片是幂等的，新浏览器完全不受影响。 */
if (typeof AbortSignal !== "undefined" && typeof AbortSignal.timeout !== "function") {
  AbortSignal.timeout = function (ms) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () {
      try { ctrl.abort(new DOMException("TimeoutError", "TimeoutError")); }
      catch (e) { ctrl.abort(); }
    }, ms || 0);
    // 手动取消时把定时器也清掉，避免计时器堆积
    try {
      ctrl.signal.addEventListener("abort", function () { clearTimeout(timer); });
    } catch (e) {}
    return ctrl.signal;
  };
}
if (typeof crypto !== "undefined" && typeof crypto.randomUUID !== "function") {
  crypto.randomUUID = function () {
    var b = new Uint8Array(16);
    if (crypto.getRandomValues) crypto.getRandomValues(b);
    else for (var i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256);
    b[6] = (b[6] & 0x0f) | 0x40;              // version 4
    b[8] = (b[8] & 0x3f) | 0x80;              // variant
    var h = "";
    for (var j = 0; j < 16; j++) h += (b[j] + 0x100).toString(16).slice(1);
    return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20);
  };
}

/* ========== 工具 ========== */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function renderMd(md){
  // 空行不显示（2026-10-23 主人要求「以后不要空行」）：
  // 后端已做同样的清理，这里是**前端保险层** —— 历史消息、旧数据、异常路径仍可能带空行。
  md = (md||"").replace(/\r\n?/g,"\n").replace(/\n{2,}/g,"\n");
  const lines = esc(md).split("\n");
  const out=[]; let inPre=false, preBuf=[];
  const flushPre=()=>{ if(preBuf.length){ out.push("<pre><code>"+preBuf.join("\n")+"</code></pre>"); preBuf=[]; } };
  for(let i=0;i<lines.length;i++){
    const line=lines[i], t=line.trim();
    if(t.startsWith("```")){ if(inPre){flushPre();inPre=false;} else inPre=true; continue; }
    if(inPre){ preBuf.push(line); continue; }
    // 表格：首行 |…| 且下一行是分隔行 |---|---| 才认，否则带竖线的普通文本会被误判。
    if(t.startsWith("|") && /^\|[\s:\-|]+\|$/.test((lines[i+1]||"").trim())){
      flushPre();
      const rows=[];
      while(i<lines.length && lines[i].trim().startsWith("|")){ rows.push(lines[i].trim()); i++; }
      i--;
      out.push(tableHtml(rows));
      continue;
    }
    if(/^#{1,4}\s/.test(t)){ flushPre(); out.push(`<b>${t.replace(/^#+\s*/,"")}</b>`); continue; }
    if(/^[-*]\s+/.test(t)){ flushPre(); out.push(`<div>• ${t.replace(/^[-*]\s+/,"")}</div>`); continue; }
    if(/^\d+[.、)]\s+/.test(t)){ flushPre(); out.push(`<div>${t}</div>`); continue; }
    if(/^(-{3,}|\*{3,})$/.test(t)){ flushPre(); out.push('<div class="hr"></div>'); continue; }
    flushPre(); out.push(line);
  }
  flushPre();
  /* ⚠️⚠️ 2026-10-26 修（主人报「回答中还是出现了各种的换行」）：
     上面每条「编号步骤 / 项目符号」都被包成 `<div>`，是**块级元素**（自己就占一行）；
     而 `out.join("\n")` 又在每个条目之间插了一个 `\n`。`.bubble` 是
     `white-space:pre-wrap` ⇒ 那个 `\n` 会**再渲染出一整行空白**。
     结果就是：每条步骤、每个 `•` 后面都多一个空行（实测截图：7 条内容撑出 6 个空行）。
     ⚠️ 后端 `_strip_blank_lines` 已经把**文本里**的空行去干净了（实测该答案 0 个空行），
        所以这个空行纯粹是**渲染层造出来的** —— 只改文本永远修不掉。

        因为普通文本行还是要靠它换行。 */
  let html = out.join("\n")
    .replace(/<\/(div|table|pre|ul|ol|li|p)>\n/g, "</$1>")
    .replace(/\[S(\d+)\]/g,'<b style="color:#7c3aed">[S$1]</b>')
    .replace(/\[(\d+)\]/g,'<b style="color:#2563eb">[$1]</b>');

  html = html.replace(/`([^`]+)`/g,"<code>$1</code>")
             .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  return html;
}
/* markdown 表格（| 表头 | …  +  |---|---|）→ 真 <table>。
   助手被要求「编码/参数/卡种对照优先用表格」，但气泡原本只会把竖线原样显示出来。
   ⚠️ 表格 HTML 必须拼成**一行**：.bubble 是 white-space:pre-wrap，拼进去的换行会变成可见空白。 */
function tableHtml(rows){
  const cells = r => r.replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
  const head = cells(rows[0]), body = rows.slice(2).map(cells);
  let h = '<table class="md-tbl"><thead><tr>'
        + head.map(c=>`<th>${c}</th>`).join("")
        + '</tr></thead><tbody>';
  for(const r of body){
    h += '<tr>' + head.map((_c,i)=>`<td>${r[i]||""}</td>`).join("") + '</tr>';
  }
  return h + '</tbody></table>';
}

  box.hidden = !on && !!$("icard") && !_timeEditing;   // 首屏默认交给卡里的「发生时间」，底部不重复出现
  box.classList.remove("miss");
  $("timeVal").hidden  = showInput;     // 只读徽标
  $("timeEdit").hidden = showInput;     // 「修改」
  $("logTime").hidden  = !showInput;    // 输入框
  if(!showInput) $("timeVal").textContent = fmtDTshort(_reportTime);
  else if(document.activeElement!==$("logTime")) $("logTime").value = _reportTime || "";
}

/* 报障卡刷新入口：卡片渲染时会把实现挂到 window._cardRefresh。
   ⚠️ 必须有这层间接——addCardImages / renderThumbs 是卡外的顶层函数，
   直接调卡内的 refreshCard 会 ReferenceError（曾导致「加截图后卡在上传中」）。
   卡片不在页面上时静默返回，调用方无需判断。 */
function refreshCard(){ if(typeof window._cardRefresh === "function") window._cardRefresh(); }

/* ---------- 报障截图：压缩 → 存本机 → 只用返回的 id ---------- */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error("读取失败"));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("不是有效的图片"));
      img.onload=()=>{
        const sc=Math.min(1, IMG_MAX_EDGE/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*sc)), h=Math.max(1,Math.round(img.height*sc));
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        const cx=cv.getContext("2d");
        cx.fillStyle="#fff"; cx.fillRect(0,0,w,h);   // 透明底转白，否则转 JPEG 会变黑
        cx.drawImage(img,0,0,w,h);
        let out=""; try{ out=cv.toDataURL("image/jpeg",0.82); }catch(_){}
        resolve(out || fr.result || "");
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function addCardImages(files){
  for(const f of files){
    if(_cardImgs.length>=MAX_IMGS){ showToast(`最多上传 ${MAX_IMGS} 张截图，多余的已忽略`,"bad"); break; }
    if(!f.type || !f.type.startsWith("image/")){ showToast(`「${f.name}」不是图片，已跳过`,"bad"); continue; }
    const it={id:null, url:null, data:"", name:f.name||"截图", up:"doing"};
    _cardImgs.push(it); renderThumbs(); refreshCard();
    try{
      it.data=await compressImage(f);
      renderThumbs();
      // 存本机换 id：这样图片能跨刷新保留、能随「复制给人工」转交，
      // 也避免把大图塞进 /ask 请求体。上传失败不影响提问（send 时用 base64 兜底）。
      const r=await fetch("/upload",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({dataUrl:it.data, name:it.name}),
        signal:AbortSignal.timeout(60000)
      });
      const j=await r.json().catch(()=>({}));
      if(r.ok && j.id){ it.id=j.id; it.url=j.url; it.up="ok"; }
      else it.up="fail";
    }catch(e){ it.up="fail"; }
    renderThumbs(); refreshCard();
  }
}
function renderThumbs(){
  const box=$("thumbs"); if(!box) return;
  box.innerHTML="";
  _cardImgs.forEach((it,i)=>{
    const d=document.createElement("div"); d.className="thumb";
    const src=it.data||it.url||"";
    d.innerHTML=(src?`<img src="${esc(src)}" alt="${esc(it.name)}">`:"")
      + `<button type="button" class="rm" title="移除这张">✕</button>`
      + (it.up==="doing" ? `<span class="up">上传中…</span>`
        : it.up==="fail" ? `<span class="up">离线待发</span>` : "");
    d.querySelector(".rm").addEventListener("click",()=>{ _cardImgs.splice(i,1); renderThumbs(); refreshCard(); });
    box.appendChild(d);
  });
}

/* ==================== 主对话输入框：附件输入（2026-10-27）====================
   支持**仅图片 + txt**（主人定），三条入口共用一条管线：
     · 图片 → compressImage → POST /upload → 换 id → 随消息发 images
     · txt  → 读文本 → 存 _logAttach → 发送时拼进 question
     · 其它（zip/rar/exe/pdf…）→ **拒收**，弹提示

   ⚠️ 为什么 accept 不能当校验：accept 只是选择框的默认过滤，用户能切成「所有文件」，
      拖拽更是完全绕过 accept。所以必须在代码里按 MIME/后缀再判一次。
*/
/* 单文件统一上限（2026-11-02 主人定）：图片 / txt / zip 一律 5MB。
   ⚠️ 后端 KB_UPLOAD_MB / ZIP_MAX_MB 同步为 5；worker 的 body 上限 8MB
      （5MB 走 base64 后约 6.7MB，正好卡在 8MB 之内）。 */
const ATTACH_MAX_BYTES = 5 * 1024 * 1024;
const ATTACH_MAX_TXT_BYTES = ATTACH_MAX_BYTES;   // txt 同上（再大模型也吃不下）
const ATTACH_MAX_TXT_LINES = 3000;              // 超过就截断，避免撑爆 prompt

function isImageFile(f){
  return !!(f && f.type && f.type.startsWith("image/"));
}
function isTxtFile(f){
  if(!f) return false;
  const n = (f.name || "").toLowerCase();
  return f.type === "text/plain" || n.endsWith(".txt") || n.endsWith(".log");
}
/* 拒收提示：把用户实际选了什么说清楚，比「格式不支持」有用 */
function rejectFile(f){
  const n = f && f.name ? f.name : "该文件";
  const ext = (n.match(/\.([a-z0-9]+)$/i) || [])[1] || "";
  const kind = ext ? `.${ext.toLowerCase()}` : "这个类型";
  showToast(`不支持 ${kind}：目前只能传图片、txt 或 zip 日志包`, "bad");
}

/* zip 日志包：直接交给 ingestLogFile（后端解压 + 按时间窗截取），不另写一套。
   ⚠️ 2026-11-07 主人要求：消息型输入也**必须先有「发生时间」**。
      原行为是「没填时间就自动取日志末尾 / 最后 1 小时」，但报障时间一旦延迟，
      这个窗口就会切到错误的一段（漏掉真正出问题的那几分钟）。
      现在改成与报障卡同一口径：没时间 → 先挂起文件 + 要求补填，
      填完由 fTime 的监听自动接着按「发生时间 ±1 小时」截取。 */
async function attachZipFile(f){
  if(_logAttach){ showToast("已经有 1 份日志附件了，先移除再加", "bad"); return; }
  if(f.size > ATTACH_MAX_BYTES){
    showToast(`日志包太大了（${fmtKB(f.size)}），上限 ${fmtKB(ATTACH_MAX_BYTES)}`, "bad"); return;
  }
  await ingestLogFile(f, null);   // 不传 autoTail：无时间 → 挂起并提示补填（见 ingestLogFile）
}

/* txt 附件：读文本 → 存进 _logAttach（复用发送端「拼进问题」的逻辑）。
   ⚠️ 特意**不走** ingestLogFile —— 那个强依赖「发生时间」并按前后 1 小时截取，
      是报障场景的产物；在底部输入框里随便问一句，不该被要求先填发生时间。 */
async function attachTxtFile(f){
  if(_logAttach){
    showToast("已经有 1 份文本附件了，先移除再加", "bad"); return;
  }
  if(f.size > ATTACH_MAX_TXT_BYTES){
    showToast(`txt 太大了（${fmtKB(f.size)}），上限 ${fmtKB(ATTACH_MAX_TXT_BYTES)}`, "bad"); return;
  }
  let txt = "";
  try{ txt = await f.text(); }
  catch(_){ showToast("文件读取失败，请重试", "bad"); return; }

  let lines = txt.split(/\r?\n/);
  let dropped = 0;
  if(lines.length > ATTACH_MAX_TXT_LINES){
    dropped = lines.length - ATTACH_MAX_TXT_LINES;
    lines = lines.slice(0, ATTACH_MAX_TXT_LINES);
  }
  _logAttach = {
    name: f.name || "文本附件",
    size: f.size || txt.length,
    win: "",
    kind: "txt",
    note: dropped ? `已附全文（过长，末尾 ${dropped} 行未包含）` : "已附全文",
    text: lines.join("\n"),
    took: lines.length, rows: lines.length,
    file: f,
  };
  renderLogAttach();
  hideErr();
}

/* 统一入口：按类型分流。图片 / txt / zip 收下，其余拒收。 */
async function addAttachFiles(files){
  const list = Array.from(files || []);
  if(!list.length) return;
  const imgs = [], txts = [], zips = [], bad = [];
  for(const f of list){
    if(isImageFile(f)) imgs.push(f);
    else if(isTxtFile(f)) txts.push(f);
    else if(isZipFile(f)) zips.push(f);
    else bad.push(f);
  }
  if(bad.length) rejectFile(bad[0]);          // 只提示第一个，避免一屏 toast
  if(imgs.length) await addChatImages(imgs);
  for(const f of txts) await attachTxtFile(f); // txt 一次只收一份（见 attachTxtFile）
  for(const f of zips) await attachZipFile(f); // zip 同样一次一份
  refreshSendBtn();
}


async function addChatImages(files){
  const list = Array.from(files||[]);
  if(!list.length) return;
  for(const f of list){
    if(_chatImgs.length >= MAX_IMGS){
      showToast(`一次最多 ${MAX_IMGS} 张图，多余的已忽略`, "bad"); break;
    }
    if(!f.type || !f.type.startsWith("image/")){
      showToast(`「${f.name||"该文件"}」不是图片，已跳过`, "bad"); continue;
    }
    // 2026-11-02：单文件统一 5MB 上限（压缩前就拦，避免白白吃内存）
    if((f.size||0) > ATTACH_MAX_BYTES){
      showToast(`图片太大了（${fmtKB(f.size)}），上限 ${fmtKB(ATTACH_MAX_BYTES)}`, "bad"); continue;
    }
    const it = {id:null, url:null, data:"", name:f.name||"粘贴的图片", up:"doing"};
    _chatImgs.push(it); renderChatThumbs();
    try{
      it.data = await compressImage(f);       // 压缩（浏览器端），顺带拿到 base64
      renderChatThumbs();
      // 存到本机换 id：这样图片能跨刷新保留、也避免把大图塞进 /ask 请求体。
      // 上传失败不阻塞提问 —— doSend 会用 base64 兜底（见 images: im.id||im.data）。
      const r = await fetch("/upload",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({dataUrl:it.data, name:it.name}),
        signal:AbortSignal.timeout(60000)
      });
      const j = await r.json().catch(()=>({}));
      if(r.ok && j.id){ it.id = j.id; it.url = j.url; it.up = "ok"; }
      else it.up = "fail";
    }catch(e){ it.up = "fail"; }
    renderChatThumbs();
  }
  refreshSendBtn();   // 有图就该能发（别等 300ms 轮询）
}

function renderChatThumbs(){
  const box = $("chatThumbs"); if(!box) return;
  box.innerHTML = "";
  _chatImgs.forEach((it,i)=>{
    const d = document.createElement("div"); d.className = "thumb";
    const src = it.data || it.url || "";
    d.innerHTML = (src ? `<img src="${esc(src)}" alt="${esc(it.name)}">` : "")
      + `<button type="button" class="rm" title="移除这张">✕</button>`
      + (it.up === "doing" ? `<span class="up">上传中…</span>`
        : it.up === "fail" ? `<span class="up">离线待发</span>` : "");
    d.querySelector(".rm").addEventListener("click", ()=>{
      _chatImgs.splice(i,1); renderChatThumbs();
    });
    box.appendChild(d);
  });
  // 删光图片后若输入框也空着，发送键要重新变灰
  if(typeof refreshSendBtn === "function") refreshSendBtn();
}

/* 把剪贴板里的图片抠出来。⚠️ 只在真的含图片时才算「图片粘贴」，
   纯文本粘贴必须放行，否则用户就贴不了文字了。 */
function imagesFromClipboard(e){
  const dt = e.clipboardData || window.clipboardData;
  if(!dt) return [];
  const out = [];
  // ① 标准路径：items 里带 kind=file
  for(const it of (dt.items||[])){
    if(it.kind === "file" && it.type && it.type.startsWith("image/")){
      const f = it.getAsFile(); if(f) out.push(f);
    }
  }
  // ② 兜底：某些浏览器/输入法只给 files
  if(!out.length){
    for(const f of (dt.files||[])){
      if(f.type && f.type.startsWith("image/")) out.push(f);
    }
  }
  return out;
}

function bindAttachInput(){
  const btn = $("attachBtn"), file = $("attachFile");
  // ① 按钮 → 选文件
  if(btn && file){
    btn.addEventListener("click", ()=> file.click());
    file.addEventListener("change", ()=>{
      addAttachFiles(file.files);
      file.value = "";          // ⚠️ 必须清空：否则连续选同一张图不触发 change
    });
  }
  if(input){
    // ② 粘贴（图片的主路径；txt 不会通过粘贴进来）
    input.addEventListener("paste", (e)=>{
      const imgs = imagesFromClipboard(e);
      if(imgs.length){
        // ⚠️ 剪贴板里**同时有文字和图片**时（从 Word/网页复制一段带图的文字），
        //    不能一律 preventDefault —— 那会把文字吞掉，用户只觉得"粘贴没反应"。
        //    只在纯图时才拦默认行为。
        const hasText = ((e.clipboardData && e.clipboardData.getData("text/plain")) || "").trim().length > 0;
        if(!hasText) e.preventDefault();
        addChatImages(imgs);
      }
    });
    // ③ 拖拽（图片 + txt 都收；其它类型给明确提示）
    ["dragover","dragenter"].forEach(ev=>{
      input.addEventListener(ev, (e)=>{
        if(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes("Files")){
          e.preventDefault();   // 不拦会触发浏览器默认「打开图片」
          input.classList.add("dragging");
          const b=$("attachBtn"); if(b) b.classList.add("dragging");
        }
      });
    });
    ["dragleave","dragend"].forEach(ev=>{
      input.addEventListener(ev, ()=>{
        input.classList.remove("dragging");
        const b=$("attachBtn"); if(b) b.classList.remove("dragging");
      });
    });
    input.addEventListener("drop", (e)=>{
      input.classList.remove("dragging");
      const b=$("attachBtn"); if(b) b.classList.remove("dragging");
      const fs = e.dataTransfer && Array.from(e.dataTransfer.files||[]);
      if(fs && fs.length){
        e.preventDefault();
        addAttachFiles(fs);     // 内部会过滤类型，zip 等会被拒收并提示
      }
    });
  }
}

      <span class="icard-count" id="icCount">线索 <b>0</b>/8 · 建议至少填 4 项</span>
      <button class="icard-send" id="icSend" disabled>生成并发送 ➤</button>
    </div>
  </div>`;
  feed.appendChild(wrap);

  // ① 涉及功能：多选
  const mc=$("modChips");
  CARD_MODS.forEach(m=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip"; b.textContent=m;
    b.addEventListener("click",()=>{ b.classList.toggle("on"); cardRefresh(); });
    mc.appendChild(b);
  });
  // ② 终端类型：单选（再点一次取消）
  const tc=$("typeChips");
  CARD_TYPES.forEach(t=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip"; b.textContent=t;
    b.addEventListener("click",()=>{
      const was=b.classList.contains("on");
      tc.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
      if(!was) b.classList.add("on");
      clearMiss(); cardRefresh();
    });
    tc.appendChild(b);
  });

  const pickType=()=>{ const el=tc.querySelector(".chip.on"); return el?el.textContent.trim():""; };
  const clearMiss=()=>["fldVer","fldTime","fldDesc"].forEach(id=>{ const e=$(id); if(e) e.classList.remove("miss"); });

  function cardRefresh(){
    if(!document.getElementById("icard")) return;   // 卡片已被移除（如已发消息）
    const modN=document.querySelectorAll("#modChips .chip.on").length;
    const type=pickType();
    const verNeed = !!type && type!=="POS后台";          // POS 后台不填版本号
    $("verReq").hidden  = !verNeed;
    $("verNote").hidden = !(type==="POS后台");
    $("fVer").placeholder = (type==="POS后台") ? "POS 后台无需填写版本号" : "如 6.2.1（更新后才出现请注明）";
    let n=0;
    if(modN) n++;
    if(type) n++;
    if($("fVer").value.trim()) n++;
    if($("fShop").value.trim()) n++;
    if($("fOrder").value.trim()) n++;
    if($("fTime").value) n++;
    if($("fDesc").value.trim()) n++;
    if(_cardImgs.length) n++;
    // 把「还缺哪几项」直接写出来：按钮置灰时用户看不出缺什么，等于哑巴
    const lack=[];
    if(!modN) lack.push("① 功能");
    if(!type) lack.push("② 终端类型");
    if(verNeed && !$("fVer").value.trim()) lack.push("③ 版本号");
    if(!$("fTime").value) lack.push("⑥ 发生时间");
    if(!$("fDesc").value.trim()) lack.push("⑦ 故障描述");
    $("icCount").innerHTML = `线索 <b>${n}</b>/8 · ` + (lack.length
      ? `还缺 <b>${lack.length}</b> 项：${lack.join("、")}` : `已可发送`);
    // 按钮刻意不置灰：灰按钮不会解释自己为什么灰。缺哪几项写在计数里，
    // 点下去还会弹提示并把镜头拉到那个字段（见 checkCard）。
    $("icSend").disabled = false;
  }
  /* 送审前的必填校验：逐项给出具体提示（按钮置灰时也能说清缺什么） */
  function checkCard(){
    const type=pickType();
    if(!document.querySelectorAll("#modChips .chip.on").length)
      return {el:null, msg:"请先选「① 涉及功能」（可多选）"};
    if(!type) return {el:null, msg:"请先选「② 终端类型」（大POS / 小POS / POS后台）"};
    if(type!=="POS后台" && !$("fVer").value.trim())
      return {el:$("fldVer"), msg:"「③ POS 版本号」必填（只有 POS 后台可以不填）"};
    if(!$("fTime").value) return {el:$("fldTime"), msg:"请填写「⑥ 发生时间」（大致时间即可，用于截取附加日志）"};
    if(!$("fDesc").value.trim()) return {el:$("fldDesc"), msg:"请填写「⑦ 故障描述」"};
    return null;
  }

  wrap.querySelectorAll("input, textarea").forEach(el=>{
    el.addEventListener("input", ()=>{ clearMiss(); cardRefresh(); });
    // ⚠️ 卡里的「⑥ 发生时间」必须边填边同步成全页唯一时间源（_reportTime）。
    //    以前只在点「生成并发送」时才同步 → 用户先在卡里填了时间、再去附加日志，
    //    日志入口读到的 _reportTime 还是空的，于是又要求他「再填一次发生时间」
    //    （2026-09-16 主人反馈）。顺带把「已暂存等待时间的日志」接着处理掉，不用重选文件。
    if(el.id==="fTime"){
      // 时间定了就接着干活：① 有「已收下等时间」的文件 → 收下它；
      // ② 已经有日志 → 按新时间窗重截（时间填错改一下，日志得跟着重来）
      const reslice=()=>{
        if(_pendingLogFile){ const f=_pendingLogFile; _pendingLogFile=null; ingestLogFile(f); }
        else if(_logAttach && _logAttach.file) ingestLogFile(_logAttach.file, _logAttach._parts);
      };
      const sync=(heavy)=>{
        _timeEditing=false;
        setReportTime($("fTime").value);
        hideErr();
        // ⚠️ datetime-local 在挑选过程中会连续触发 input，直接跟着读文件会把同一份大日志读十几遍；
        //    input 只做 500ms 防抖兜底（个别路径只给 input 不给 change），change 是定稿、立刻执行。
        clearTimeout(_logSyncT);
        if(heavy) reslice(); else _logSyncT = setTimeout(reslice, 500);
      };
      el.addEventListener("input", ()=>sync(false));
      el.addEventListener("change", ()=>sync(true));
    }
  });
  // 刷新页面后卡是空的，但时间还留在 localStorage 里 —— 回填，免得用户被要求重填一次
  if(_reportTime) $("fTime").value = _reportTime;
  // 把刷新实现挂到全局：卡外的 addCardImages / renderThumbs 靠它更新计数（见顶部 refreshCard）
  window._cardRefresh = cardRefresh;
  $("imgAdd").addEventListener("click", ()=>$("fImgs").click());
  // 日志入口就挨着截图，两者都是附件；缺时间时由 ingestLogFile 兜底提示补填
  $("logAddCard").addEventListener("click", ()=>$("logFile").click());
  // 卡片右上角的关闭按钮（2026-09-24 主人定）：放弃本次报障 → 回到首屏默认状态。
  // 只在「已经填过东西」时才确认一次，避免手滑误关把填好的线索清掉。
  $("icardClose").addEventListener("click", async ()=>{
    const dirty = ($("fDesc") && $("fDesc").value.trim()) || ($("fVer") && $("fVer").value.trim())
               || _cardImgs.length || !!_logAttach || !!$("fTime").value;
    if(dirty && !(await confirmBox("关闭报障卡？已填写的内容会丢失。", "关闭", "取消"))) return;
    _entryMode="";                 // 回到首屏默认状态（报障主按钮 + 能力说明）
    _cardImgs=[]; window._pendingImgs=null;
    _logBusy=false; clearLogAttach();
    _timeEditing=false; setReportTime("");
    renderThread(); input.focus();
  });
  $("fImgs").addEventListener("change", async ev=>{
    const files=[...ev.target.files]; ev.target.value="";
    await addCardImages(files);
  });

  $("icSend").addEventListener("click", ()=>{
    const bad=checkCard();
    if(bad){
      if(bad.el) bad.el.classList.add("miss");
      showToast(bad.msg, "bad");
      if(bad.el) bad.el.scrollIntoView({block:"center", behavior:"smooth"});
      return;
    }
    window._pendingImgs = _cardImgs.slice();   // 交给 doSend 随这条消息一起发出
    _cardImgs = [];
    setReportTime($("fTime").value);           // 发生时间 → 全页唯一时间来源
    input.value = composeCard();
    doSend("report");        // 走报障口径：回答保持三段式（见 llm.py 的 mode 分支）
  });
  cardRefresh();
  renderThumbs();
  renderLogAttach();
  scrollBottom();
}
/* 把信息卡内容拼成一条结构化消息 */
function composeCard(){
  const mods=[...document.querySelectorAll("#modChips .chip.on")].map(c=>c.textContent.trim());
  const type=(document.querySelector("#typeChips .chip.on")||{}).textContent||"";
  const v=id=>{ const e=$(id); return ((e&&e.value)||"").trim(); };
  const L=[];
  const add=(k,val)=>{ if(val) L.push(`▍${k}：${val}`); };
  add("涉及功能", mods.join("、"));
  add("终端类型", type);
  if(type!=="POS后台") add("POS版本", v("fVer"));
  add("店铺/项目/设备", v("fShop"));
  add("POS单号", v("fOrder"));
  add("发生时间", fmtDT(v("fTime")));
  add("故障描述", v("fDesc"));
  if((window._pendingImgs||[]).length) add("附图", `${window._pendingImgs.length} 张（见本条消息的截图）`);
  return "【POS 报障】\n" + L.join("\n");
}
function msgNode(m, bodyHtml){
  const wrap=document.createElement("div");
  wrap.className = "msg " + (m.role==="user"?"user":"ai") + (m.welcome?" welcome":"");
  const av = m.role==="user" ? "👤" : "🛠";
  let srcHtml = "";
  if(m.role==="assistant" && m.content){
    // 只报「已查看文件 N 处」：不列具体文件/行号，也不展示参考来源（不对外暴露检索细节）
    const files = new Set((m.code||[]).map(c=>c.file));
    if(files.size) srcHtml = `<span class="src-line">🔍 已查看文件 ${files.size} 处</span>`;
  }
  // 勾选框：勾中即纳入「复制给人工」（下标取自 thread，重建后状态不丢）
  const idx = thread.indexOf(m);
  const pickHtml = idx>=0
    ? `<input type="checkbox" class="pick" data-idx="${idx}"${picked.has(idx)?" checked":""} title="勾选后可一起复制给人工">`
    : "";
  // 结论按钮：每条 AI 回答都带，用户点一下就把「这答案管用吗」沉淀成案例信号
  let vHtml = "";
  if(m.role==="assistant" && m.cid){
    const v = m.verdict || "";
    vHtml = `<div class="verdict" data-vrow="${esc(m.cid)}">`
      + `<button type="button" class="vbtn${v==="solved"?" on-ok":""}" data-cid="${esc(m.cid)}" data-v="solved">👍 已解决</button>`
      + `<button type="button" class="vbtn${v==="unsolved"?" on-bad":""}" data-cid="${esc(m.cid)}" data-v="unsolved">👎 未解决</button>`
      + `<span class="vnote${v?" done":""}" data-vnote="${esc(m.cid)}">${v ? verdictNote(v) : "这个答案管用吗？点一下帮我们筛选案例"}</span>`
      + `</div>`;
  }
  // 回答简图：后端已把模型写的 <diagram> 块渲染成 SVG 并落盘，这里只放 <img>（跨刷新仍在）。
  // ⚠️ diagHtml 必须在这里显式定义。2026-09-16 的事故：下面模板里引用了 diagHtml，但全文件
  //    没有这一句声明 → 每条消息渲染都抛 ReferenceError → doSend 在 busy=true 之后崩掉、
  //    finally 之前中断 → busy 永久为 true、发送键永久置灰、输入框内容发不出去。
  let diagHtml = "";
  const dg = m.diagram;
  if(m.role==="assistant" && dg && (dg.url || dg.svg)){
    const inner = dg.url
      ? `<img src="${esc(dg.url)}" alt="${esc(dg.title||"排障示意图")}" loading="lazy"`
        + ` onerror="var w=this.closest('.diagwrap'); if(w) w.style.display='none'">`
      : dg.svg;   // 落盘失败时的兜底：内联后端给的 SVG 内容
    diagHtml = `<div class="diagwrap">${inner}</div>`;
  }
  // 报障截图：优先用服务端地址（跨刷新仍在），本地 base64 兜底
  let imgHtml = "";
  const imgs = (m.imgs||[]).map(im=>im && (im.url||im.data)).filter(Boolean);
  if(imgs.length){
    imgHtml = `<div class="msgimgs">` + imgs.map(src=>
      `<a href="${esc(src)}" target="_blank" rel="noopener" title="点击查看原图">`
      + `<img src="${esc(src)}" alt="报障截图" loading="lazy"></a>`).join("") + `</div>`;
  }
  wrap.innerHTML = `
    ${pickHtml}
    <div class="avatar">${av}</div>
    <div class="msg-body" style="min-width:0">
      <div class="bubble">${diagHtml}${bodyHtml}</div>
      ${imgHtml}
      ${srcHtml}
      ${vHtml}
      <div class="meta">${m.time||""}</div>
    </div>`;
  return wrap;
}
/* ⚠️ 2026-10-28：这里原先是 `(append?feed:feed)` —— 三元两边都是 feed，等于永远追加，
   看着像"带 append 开关"，实际是个空操作，害得调用方以为传 false 会清屏。
   现在改成**明确的纯追加**（所以要清屏请显式用 _clearWelcomeZone / renderThread），
   去掉这个假参数，避免以后又有人被它骗。 */
function renderMsg(m){
  const node = msgNode(m, renderMd(m.content||""));
  feed.appendChild(node);
  updatePickBar();
  // ⚠️ 必须调：doSend 是**增量追加**消息的，不经过 renderThread，
  //    漏了这句「🗑 清空对话」就永远停在置灰态（2026-10-23 修的 bug）。
  updateClearBtn();
  scrollBottom();
}
function typingNode(){
  const wrap=document.createElement("div");
  wrap.className="msg ai"; wrap.id="typingMsg";
  // ⚠️ 对外文案不许出现「源码」—— 那是内部叫法，一线看不懂也不该看到（2026-09-18 主人指出）
  // ⚠️ 文案放在 <span id="queueTxt"> 里：排队时会把它替换成「前面还有几位」（见 startQueuePoll）
  wrap.innerHTML=`<div class="avatar">🛠</div><div class="msg-body" style="min-width:0"><div class="bubble"><span class="typing"><i></i><i></i><i></i></span> <span id="queueTxt">正在分析问题…</span></div></div>`;
  feed.appendChild(wrap); scrollBottom();
  startWaitHints();
  return wrap;
}

/* ========== 等待话术：按等待时长给出「进展感」（2026-10-09 主人提）==========
   背景：一次问答的端到端耗时实测是两个量级 ——
     · 简单问题（查单号 / 问菜单在哪）**中位 4 秒**，用户几乎看不到这句话；
     · 排障类问题（带日志、带错误码）**中位 53 秒、p90 67 秒、最长 81 秒**。
   而气泡原先一直停在「正在分析，结合知识库定位中…」—— 用户会以为卡死、反复刷新
   （刷新反而更糟：**丢掉正在跑的结果 + 重新排队**）。
   做法：**纯前端计时**，按秒数把"我们确实在干活"分阶段说出来，并给出预期时长。
   ⚠️ 不做假进度条（百分比是编的，一旦卡在 90% 更让人焦虑），只说事实。
   ⚠️ **绝不引导用户刷新**（2026-10-09 修）：旧版 75 秒那句写的是"可刷新重试"，
      但刷新会丢掉正在生成的结果、还要重新排队 —— 是最糟的操作。
      60 秒后改为**明确劝阻刷新**，因为那一刻正是用户最想刷新的时刻。
   ⚠️ 阶段切分按上面的实测分布定，别凭感觉改：
      0/6/18 秒覆盖 fast 档与 deep 的起步；38/65 秒覆盖 deep 的中位与 p90；
      105/138 秒是"超出历史最长耗时"之后的兜底（历史最长 81 秒）。
   ⚠️ 与排队提示**共用** <span id="queueTxt">：排队时一律让位（`_queued` 标志），
      否则会把「前面还有 N 位」冲掉 —— 那是那一刻用户最需要的信息。
   ⚠️ 文案里**不许出现「源码」**（内部叫法，2026-09-18 主人指出过）。
   ⚠️ 后端 /ask 的超时是 150 秒（见下面的 AbortSignal.timeout），话术别说过头。 */
const _WAIT_STAGES = [
  [0,   "正在分析问题…"],
  [6,   "正在检索知识库、核对相关配置与记录…"],
  [18,  "正在逐项排查可能的原因，请稍等…"],
  [38,  "线索比较多，正在一条条排除，请再等一会儿…"],
  [65,  "还在处理中 —— 不用刷新页面，刷新会丢掉这次的结果"],
  [105, "这次排查用时偏长，仍在继续（单次最长约 150 秒）…"],
  [138, "已接近单次处理上限（约 150 秒）；若超时会自动提示，可换个问法或补充信息再试"],
];
let _waitTimer=null, _waitStart=0, _queued=false;
function _waitTick(){
  const el=$("queueTxt");
  if(!el){ stopWaitHints(); return; }            // 气泡已被移除（回答到了/出错了）
  if(_queued) return;                            // 排队信息优先，别冲掉
  const sec=(Date.now()-_waitStart)/1000;
  let txt=_WAIT_STAGES[0][1];
  for(const st of _WAIT_STAGES){ if(sec>=st[0]) txt=st[1]; }
  // ⚠️ 过了 20 秒才附上秒数：更早知道"确实在走"。
  //    不更早是因为 fast 档 4 秒就出结果，秒表一闪而过反而像卡顿。
  if(sec>=20) txt += `（已等待 ${Math.floor(sec)} 秒）`;
  if(el.textContent!==txt) el.textContent=txt;
  // ⚠️ 2026-10-12 主人要求：**状态栏不再跑秒表**。
  //   原来这里每秒把状态栏改写成「AI 在线 · 已处理 N 秒」，而 checkHealth() 又会把
  //   它改成「AI 离线（本机未开机？）」—— 两个写入方**每秒互相覆盖** ⇒ 用户看到
  //   「AI 离线 · 已处理 49 秒」这种一闪一闪的怪文案。
  //   现在：状态栏只由 setStatusText 的调用方维护（健康检查/排队），这里**不碰**。
  //   「已等待 N 秒」仍留在**气泡内**（气泡不在视野时用户上滑能看到，且不会闪）。
}
function startWaitHints(){
  if(_waitTimer) clearInterval(_waitTimer);      // ⚠️ 只能清定时器，**不能调 stopWaitHints()**：
  _waitStart=Date.now();                         //    那会把状态栏重置成"AI 在线"，
  _waitTick();                                   //    白白抹掉 checkHealth() 刚设的「知识 X 段 · 数据在线」
  _waitTimer=setInterval(_waitTick,1000);
}
/* ⭐ 2026-10-12（主人定"动态超时+给时间预期"）：提交前**按任务规模估算预期耗时**。
   口径与后端 _time_budget 对齐：fast≈10s / deep 基线≈60s / 每多一个长数字串（单号）+15s。
   只用于**预期管理**（写进状态栏"预计约 N 秒"），不是硬超时 —— 硬超时仍是 240s。 */
function estimateWait(text){
  const ids = (text.match(/\d{14,}/g)||[]).length;
  const heavy = /日志|报错|截图|为什么|排查|分析/.test(text||"");
  let sec = heavy ? 60 : 15;                     // deep 基线 / fast 常见值
  if(heavy) sec += Math.max(0, ids-1) * 15;      // 批量查单每个 +15s
  return Math.min(sec, 160);
}
function stopWaitHints(){
  if(_waitTimer){ clearInterval(_waitTimer); _waitTimer=null; }
  // 收尾把状态栏交回底稿（排队流程随后也会自己设，不冲突）；正常态不显示这一行
  if(!_queued){ setStatusText(_statusBase||"助手 在线"); _showStatus(false); }
}

/* ========== 排队提示（2026-09-25 主人提）==========
   多人同时用时，后端会限制并发（默认 4）并让超出的请求排队。
   不提示的话，用户看到"转圈"会以为卡死而反复刷新（反而更堵）。
   做法：提交前生成一个随机 rid 一起发给后端，之后每 2 秒问一次「我前面还有几位」。
   ⚠️ 查询失败一律静默 —— 排队提示是锦上添花，绝不能因为它弹错或打断提问。 */
let _queueTimer=null;
function newRid(){
  try{ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(_){}
  return Date.now().toString(36) + Math.random().toString(36).slice(2,10);
}
async function _queueTick(rid){
  const el=$("queueTxt");
  if(!el){ stopQueuePoll(); return; }
  try{
    const r=await fetch(`/queue-status/${encodeURIComponent(rid)}`,{signal:AbortSignal.timeout(5000)});
    const j=await r.json().catch(()=>({}));
    if(j && j.ahead>0){
      // 气泡里说清"前面几位、系统在忙什么"
      _queued=true;                                   // 让位：等待话术暂停更新（见 startWaitHints）
      el.textContent=`排队中：前面还有 ${j.ahead} 位（正在处理 ${j.active||0}/${j.limit||3}）`;
      // 状态栏给出**我自己的位次**（主人 2026-09-25 提：用户最想知道的是"我排第几个"）
      setStatusText(`你排在第 ${j.ahead+1} 位`);
      _showStatus(true);                              // 排队中 → 显示
    }else{
      // 轮到自己了（或已经在处理中）：状态栏回到底稿
      _queued=false;
      setStatusText(_statusBase);
      _showStatus(false);                             // 没在排队 → 隐藏（正常态不占版面）
    }
  }catch(_){ /* 静默 */ }
}
function startQueuePoll(rid){
  stopQueuePoll();
  _queueTick(rid);
  _queueTimer=setInterval(()=>_queueTick(rid),2000);
}
function stopQueuePoll(){
  if(_queueTimer){ clearInterval(_queueTimer); _queueTimer=null; }
  setStatusText(_statusBase);   // 复原状态栏（去掉"你排在第 N 位"）
}

/* ========== 案例信号：已解决 / 未解决 ==========
   背景：助手目前只覆盖一部分报障，多数最终要转人工。用户点「已解决/未解决」、点「复制给人工」，
   本身就是最真实的标注 —— 但此前这些信号只活在浏览器本地，没人看得到。现在每次点击都会回写
   一条案例到本机（/feedback）；运维只在「案例审查」页里判断：哪些能入库、哪些要人工纠正。
   ⚠️ 上报是「顺手做的事」：任何异常一律静默吞掉，绝不能让标记动作本身妨碍用户。 */
const newCid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

function verdictNote(v){
  if(v==="solved") return "已标记：已解决（可入库候选）";
  if(v==="unsolved") return "已标记：未解决（已进入待处置清单）";
  return "";
}
/* 找这条回答对应的问题（往前最近的一条用户消息） */
function caseOf(m){
  const i = thread.indexOf(m);
  for(let k=i-1;k>=0;k--){ if(thread[k] && thread[k].role==="user") return thread[k]; }
  return null;
}
/* 报障卡里填过的结构化字段（卡还在页面上时才取得到；取不到就不带，不影响上报） */
function caseMeta(){
  const out = {};
  try{
    const mods = [...document.querySelectorAll("#modChips .chip.on")].map(c=>c.textContent.trim());
    const t = document.querySelector("#typeChips .chip.on");
    if(mods.length) out["功能"] = mods.join("/");
    if(t) out["终端"] = t.textContent.trim();
    const g = id => { const el=$(id); return el ? (el.value||"").trim() : ""; };
    if(g("fVer"))   out["版本"] = g("fVer");
    if(g("fShop"))  out["店铺"] = g("fShop");
    if(g("fOrder")) out["单号"] = g("fOrder");
  }catch(_){}
  return out;
}
async function reportCase(m, via){
  if(!m || !m.cid) return;
  const q = caseOf(m);
  try{
    await fetch("/feedback",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        id:m.cid, ts:m.ts||undefined,
        question:(q && q.content || "").slice(0,6000),
        answer:(m.content||"").slice(0,20000),
        verdict:m.verdict||"none", via:via||"click",
        user:m.user||"",
        meta:caseMeta(),
        imgs:(m.imgs||[]).map(im=>im.id).filter(Boolean)
      }),
      signal:AbortSignal.timeout(15000)
    });
  }catch(_){ /* 静默：上报失败也不能妨碍用户 */ }
}
function paintVerdict(m){
  if(!m || !m.cid) return;
  const v = m.verdict || "";
  document.querySelectorAll(`.vbtn[data-cid="${m.cid}"]`).forEach(b=>{
    b.classList.toggle("on-ok",  v==="solved"   && b.dataset.v==="solved");
    b.classList.toggle("on-bad", v==="unsolved" && b.dataset.v==="unsolved");
  });
  const n = document.querySelector(`[data-vnote="${m.cid}"]`);
  if(n){ n.textContent = v ? verdictNote(v) : "这个答案管用吗？点一下帮我们筛选案例";
    n.classList.toggle("done", !!v); }
}
function setVerdict(cid, v){
  const m = thread.find(x=>x && x.cid===cid);
  if(!m) return;
  m.verdict = (m.verdict===v) ? "" : v;      // 再点一次 = 取消标记
  paintVerdict(m); saveThread(); reportCase(m,"click");
  if(m.verdict==="solved")        showToast("已标记「已解决」：进入可入库候选","ok");
  else if(m.verdict==="unsolved") showToast("已标记「未解决」：已通知运维跟进","ok");
  else                            showToast("已取消标记");
}

/* ========== 会话持久化 ========== */
/* ⚠️ 截图只存服务端 id/url，绝不存 base64：几张图就把 localStorage（约 5MB）撑爆，
   而 saveThread 失败会整份清空历史，代价太大。刷新后用 /img/<id> 仍能正常显示。
   简图同样只存 url 不存 svg。
   `slimThread()` 抽出来是因为「存本地」和「同步到服务端」要用同一份序列化 —— 两处各写一遍必然走样。 */
function slimThread(){
  return thread.slice(-MAX_THREAD).map(m=>({
    role:m.role, content:(m.content||"").slice(0,6000), time:m.time,
    d:m.d||null,                       // 本地自然日：跨天上下文隔离用（2026-10-28）
    sources:m.sources||[], code:m.code||[],
    cid:m.cid||null, verdict:m.verdict||"", ts:m.ts||null,
    user:m.user||"",
    diagram: m.diagram ? {kind:m.diagram.kind||"", title:m.diagram.title||"", url:m.diagram.url||""} : null,
    imgs:(m.imgs||[]).map(im=>({id:im.id||null, url:im.url||null, name:im.name||""})).filter(im=>im.id||im.url)
  }));
}
function saveThread(){
  /* ⚠️ 2026-10-12（第四~六轮审计 §3.2）：**配额满时不再一次清空全部历史**。
     原写法：`catch(e){ localStorage.removeItem(LS_KEY); }` —— 一旦超过 5MB 配额，
     **整份对话历史被清空**（不是丢最旧，是全丢）⇒ 用户刷新后看到一片空白。
     ⚠️ 已有两层防护（截图只存 id 不存 base64、MAX_THREAD=100 限条数），
        所以这是极端情况的兜底；但"全丢"的代价太大，值得改。
     新做法：**渐进丢弃** —— 每轮从最旧的一端砍掉 5 条再试，
     直到写入成功或只剩最后 1 条（保留最新上下文，比全空有用得多）。 */
  const all = slimThread();
  for(let keep = all.length; keep >= 1; keep -= 5){
    try{
      localStorage.setItem(LS_KEY, JSON.stringify(all.slice(-keep)));
      if(keep < all.length) console.warn(`[localStorage] 配额不足，仅保留最近 ${keep} 条`);
      return;
    }catch(_){ /* 继续砍 */ }
  }
  // 只剩 1 条还写不进（极端）—— 才清空，至少让后续能继续用
  try{ localStorage.removeItem(LS_KEY); }catch(_){}
}

/* ========== 会话 ID：跨设备续聊 ==========
   场景：这台电脑答到一半，换台电脑（或转人工）要接着看 —— 凭会话 ID 把整段拉回来，
   消息里的日志、截图引用、简图也都跟着回来。服务端只保留 7 天，过期即删。
   ⚠️ 同步是「顺手做的事」：任何异常一律静默吞掉，绝不能影响问答主流程（同 reportCase 口径）。 */
function saveSid(sid){
  _sid = sid || "";
  try{ _sid ? localStorage.setItem(LS_SID_KEY,_sid) : localStorage.removeItem(LS_SID_KEY); }catch(_){}
  paintSid();
}
function shortSid(){ return _sid ? _sid.replace(/^pos-/,"").slice(0,8) : ""; }
function paintSid(){
  const el = $("sidBtn"); if(!el) return;
  el.hidden = !_sid;
  // 2026-09-27 主人定：显示为「（talkID:xxxx）」，贴在标题后方
  el.textContent = _sid ? `（talkID:${shortSid()}）` : "";
  el.title = _sid ? `会话 ID（talkID）：${_sid}\n点一下复制，换台电脑凭它继续本会话` : "";
}
async function syncSession(){
  try{
    const title = (thread.find(m=>m && m.role==="user") || {}).content || "";
    if(!_sid){
      const r = await fetch("/session/new", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({title:title.slice(0,60)}),
        signal: AbortSignal.timeout(10000)
      });
      const j = await r.json().catch(()=>({}));
      if(!j.sid) return;
      saveSid(j.sid);
    }
    await fetch("/session/sync", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({sid:_sid, title:title.slice(0,60), messages:slimThread()}),
      signal: AbortSignal.timeout(15000)
    });
  }catch(_){ /* 静默：同步失败不能妨碍用户 */ }
}
/* 从会话 ID 拉取并接管当前页面。⚠️ 会覆盖本地对话，调用前必须让用户确认。 */
async function openSession(sid){
  const clean = (sid||"").trim().toLowerCase();
  if(!/^pos-[0-9a-z]{14}$/.test(clean)){
    showToast("会话 ID 格式不对：应为 pos- 开头的 14 位字符","bad"); return false;
  }
  let doc;
  try{
    const r = await fetch(`/session/${clean}`, { signal: AbortSignal.timeout(15000) });
    if(r.status === 404){
      const j = await r.json().catch(()=>({}));
      showToast(j.detail || "会话不存在或已过期（会话仅保留 7 天）","bad"); return false;
    }
    if(!r.ok){ showToast(`拉取失败（${r.status}）`,"bad"); return false; }
    doc = await r.json();
  }catch(e){ showToast("拉取失败：网络或服务异常","bad"); return false; }

  thread = Array.isArray(doc.messages) ? doc.messages : [];
  _backfillDays();   // 老会话没有 d：补日期，跨天隔离才生效（2026-10-28）
  picked.clear();   // 2026-11-02：拉回来**不再默认全选** —— 交给 doCopy 在用户点复制时确认
  saveSid(doc.sid || clean);
  saveThread();
  renderThread();
  showToast(`已继续会话 ${shortSid()}…（共 ${thread.length} 条）`,"ok");
  return true;
}
function copySid(){
  if(!_sid) return;
  copyText(_sid).then(ok=>{
    showToast(ok ? `会话 ID 已复制：${_sid}` : `会话 ID：${_sid}（复制失败，请手动记下）`, ok?"ok":"bad");
  });
}
/* ---------- 跨天上下文隔离（2026-10-28）----------
   主人要求：过了当天，历史记录**继续留在本地可查看**，但**不再作为上下文**发给模型。
   做法：每条消息打一个本地自然日 `d`；doSend 只把「今天」的消息放进 history。
   ⚠️ 后端不用改 —— 它只认请求里的 history（/ask 不读服务端会话存档）。
   ⚠️ 检索主 query / 日志证据都是后端从 history 里挑的，所以前端一过滤，旧问题就带不偏了。 */
function _dayKey(ts){
  const d = new Date(Number(ts) || Date.now());
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
/* 老数据没有 `d`：优先用自身 ts（助手消息有），否则用最新 ts 兜底 ——
   保证部署当天不会"突然失忆"，第二天起自然不再参与。 */
function _backfillDays(){
  const newest = thread.reduce((mx,m)=>Math.max(mx, Number(m && m.ts)||0), 0);
  const fallback = _dayKey(newest || Date.now());
  thread.forEach(m=>{ if(m && !m.d) m.d = m.ts ? _dayKey(m.ts) : fallback; });
}

function loadThread(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const arr = JSON.parse(raw);
    if(Array.isArray(arr) && arr.length){ thread = arr; _backfillDays(); }
  }catch(_){}
}

/* ========== 勾选 & 复制给人工 ==========
   背景：助手目前只能覆盖一部分问题，多数报障最终要转人工。人工接手时若只看到一大段
   原始对话，仍需重新读一遍、甚至再问用户一遍。这里让用户勾选需要的对话 → 调 /summarize
   生成「交接简报」→ 摘要 + 原始对话一起进剪贴板，人工拿到即可接手。
   ⚠️ 复制是主功能、摘要只是增强：摘要失败也必须能复制出去，绝不允许整体失败。 */
function updatePickBar(){
  // 2026-09-27：这一行回到输入框上方（#pickBar），无对话时整条隐藏 —— 恢复原行为。
  const bar=$("pickBar");
  if(!bar) return;
  if(!thread.length){ bar.style.display="none"; return; }
  bar.style.display="flex";
  const n=picked.size;
  /* 2026-11-02：默认一条都不勾。这里的文案要把「未勾选」说破，
     否则用户看着一个空数字不知道要自己动手（见 doCopy 里的提示）。 */
  $("pickInfo").innerHTML = (n
      ? `已选 <b>${n}</b>/${thread.length} 条`
      : `未勾选（共 ${thread.length} 条）`)
    + ` · <button type="button" class="mini-link" id="pickAllBtn">${n>=thread.length?"取消全选":"全选"}</button>`;
  const btn=$("copyBtn");
  /* ⚠️ 这里**不能**因为 n=0 就 disabled —— 那样用户点了没反应，
     而我们要的正是「点一下 → 提示他勾选」。空勾选的处理交给 doCopy。 */
  btn.disabled = copying;
  btn.textContent = copying ? "⏳ 正在生成摘要…" : (n ? `📋 复制给人工（${n} 条）` : "📋 复制给人工");
}

/* 一条都没勾时让勾选框闪一下 —— 否则用户不知道该点哪儿（2026-11-02） */
function flashPick(){
  feed.querySelectorAll(".pick").forEach(el=>{
    el.classList.add("hint");
    setTimeout(()=>{ try{ el.classList.remove("hint"); }catch(_){} }, 2400);
  });
}

function showToast(msg, kind){
  const t=$("toast");
  t.className="toast show"+(kind?" "+kind:"");
  t.textContent=msg;
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>{ t.className="toast"+(kind?" "+kind:""); }, 4500);
}

/* 居中确认框（2026-10-28）：替代原生 confirm。
   ⚠️ 原生 confirm 在 Chrome 里是贴在窗口顶部的一条，鼠标要跑很远、样式也突兀。
   这里用和「能做什么」同一套居中遮罩；返回 Promise<boolean>，调用方记得 await。 */
function confirmBox(msg, okText, cancelText){
  return new Promise(resolve=>{
    const mask=$("cfmMask"), tx=$("cfmText");
    tx.textContent = msg || "确定吗？";
    $("cfmYes").textContent = okText || "确定";
    $("cfmNo").textContent  = cancelText || "取消";
    mask.classList.add("show");
    const done = v=>{
      mask.classList.remove("show");
      document.removeEventListener("keydown", onKey);
      resolve(v);
    };
    const onKey = e=>{
      if(e.key==="Escape"){ e.preventDefault(); done(false); }
      else if(e.key==="Enter"){ e.preventDefault(); done(true); }
    };
    $("cfmYes").onclick = ()=>done(true);
    $("cfmNo").onclick  = ()=>done(false);
    mask.onclick = e=>{ if(e.target===mask) done(false); };
    document.addEventListener("keydown", onKey);
    // 焦点给「确定」，键盘用户可直接回车
    setTimeout(()=>{ try{ $("cfmYes").focus(); }catch(_){} }, 30);
  });
}

/* 居中输入框（2026-10-28）：替代原生 prompt。
   用于「继续会话」粘贴会话 ID —— 原生 prompt 同样贴在窗口顶部，且样式不可控。
   返回 Promise<string|null>：点确定回输入值（已 trim），取消/点遮罩/Esc 回 null。 */
function inputBox(title, placeholder, okText){
  return new Promise(resolve=>{
    const mask=$("inpMask"), field=$("inpField");
    $("inpTitle").textContent = title || "";
    field.value = "";
    field.placeholder = placeholder || "";
    $("inpYes").textContent = okText || "确定";
    mask.classList.add("show");
    const done = v=>{
      mask.classList.remove("show");
      document.removeEventListener("keydown", onKey);
      resolve(v);
    };
    const onKey = e=>{
      if(e.key==="Escape"){ e.preventDefault(); done(null); }
      else if(e.key==="Enter"){ e.preventDefault(); done(field.value.trim()); }
    };
    $("inpYes").onclick = ()=>done(field.value.trim());
    $("inpNo").onclick  = ()=>done(null);
    mask.onclick = e=>{ if(e.target===mask) done(null); };
    document.addEventListener("keydown", onKey);
    setTimeout(()=>{ try{ field.focus(); }catch(_){} }, 40);
  });
}

async function copyText(txt){
  try{
    if(navigator.clipboard && window.isSecureContext){
      // ⚠️ 必须加超时：某些浏览器里 writeText 在无用户手势/权限被挂起时会一直不 settle，
      // 不加护栏按钮会永久停在「正在生成摘要…」。超时后走下面的 execCommand 降级。
      await Promise.race([
        navigator.clipboard.writeText(txt),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error("clipboard timeout")), 3000))
      ]);
      return true;
    }
  }catch(_){}
  // 降级：非安全上下文 / 剪贴板被拒时用 execCommand
  try{
    const ta=document.createElement("textarea");
    ta.value=txt; ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:-2000px;left:0;opacity:0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, txt.length);
    const ok=document.execCommand("copy");
    ta.remove();
    return ok;
  }catch(_){ return false; }
}

/* 交给人工的文本：AI 交接简报 + 原始对话（原文永远保留，摘要失败也不影响） */
function buildHandoff(summary, items){
  const when=new Date().toLocaleString("zh-CN",{hour12:false});
  const body=items.map(m=>{
    const who = m.role==="user" ? "用户" : "助手";
    const tm = m.time ? m.time+" " : "";
    // 截图只能给链接：人工点开看原图（本机服务在线时有效）
    const pics = (m.imgs||[]).map((im,i)=>im.url ? `  🖼 截图${i+1}：${absUrl(im.url)}` : "").filter(Boolean).join("\n");
    return `【${tm}${who}】\n${(m.content||"").trim()}` + (pics ? "\n"+pics : "");
  }).join("\n\n");
  const brief = summary || "（摘要生成失败，请人工从下方原始对话接手）";
  // 会话 ID 放最上面：人工拿它就能在自己电脑上把整段会话拉出来（含日志与截图引用）。
  // 拉不到时服务端会如实回「不存在或已过期」，所以这里写清 7 天，免得人工以为永久有效。
  const sidLine = _sid
    ? `会话 ID：${_sid}\n（人工可在 ask.example.com 点「📥 继续会话」粘贴它，拉到完整会话；服务端保留 7 天）\n`
    : "";
  return `【POS 报障 · 转人工交接】\n${sidLine}生成时间：${when}\n\n${brief}\n\n`
       + `———— 原始对话（${items.length} 条）————\n\n${body}\n`;
}
/* /img/xxx → 完整可点链接（人工多半不在这个页面上，必须给绝对地址） */
function absUrl(u){
  try{ return new URL(u, location.href).href; }catch(_){ return u; }
}

async function doCopy(){
  if(copying || _copyAsk) return;
  /* ⭐ 2026-11-02 主人要求：消息**默认不勾选**，复制时再让用户挑。
     原来新消息/恢复历史都自动全选，一键复制会把整段无关对话全塞给人工。
     现在一条没勾时先问一句：要么「全选并复制」（保留一键快路径），
     要么「我自己勾」→ 勾选框闪一下并给提示。 */
  if(!picked.size){
    if(!thread.length){ showToast("还没有对话可以复制","bad"); return; }
    _copyAsk = true;
    let all = false;
    try{
      all = await confirmBox(
        `还没有勾选任何消息。要复制全部 ${thread.length} 条吗？`,
        "全选并复制", "我自己勾");
    }finally{ _copyAsk = false; }
    if(!all){ flashPick(); showToast("点消息左上角的小方框，勾选要复制的内容","ok"); return; }
    thread.forEach((m,i)=>picked.add(i));
    renderThread();
  }
  const items=[...picked].sort((a,b)=>a-b).map(i=>thread[i]).filter(m=>m&&m.content);
  if(!items.length){ showToast("请先勾选要复制的对话","bad"); return; }
  copying=true; updatePickBar();
  let summary="";
  try{
    const r=await fetch("/summarize",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:items.map(m=>({role:m.role, content:m.content}))}),
      signal:AbortSignal.timeout(100000)
    });
    if(r.ok) summary=((await r.json()).summary||"").trim();
  }catch(_){}
  const ok=await copyText(buildHandoff(summary, items));
  copying=false; updatePickBar();
  if(!ok){ showToast("复制失败：浏览器未放行剪贴板，请手动选中对话复制","bad"); return; }
  // 走到「转人工」是一个真实信号，回写案例供审查 —— 但**不再自动判未解决**。
  // ⚠️ 2026-10-28 主人要求：复制给人工常常只是「转给同事看」，不等于答案没解决。
  //   原先这里会自动设 verdict=unsolved 并推未解决通知，于是「先复制、后标已解决」时
  //   会出现「通知说未解决 / 页面说已解决」的自相矛盾
  //   （实证 pos-231y820f3fvtd8：10:24 三条记录 none → unsolved(copy) → solved(click)）。
  //   标记权交回用户自己：点「已解决 / 未解决」才算数。
  markCopied(items);
  showToast(summary
    ? `已复制：AI 交接摘要 + ${items.length} 条原文，可直接粘贴给人工`
    : `已复制 ${items.length} 条原文（摘要未能生成，不影响交接）`, "ok");
}

/* 勾选转人工 → 只回写「这次转人工了」这个信号，**不改 verdict**（2026-10-28 起）。
   ⚠️ 一定要沿用当前 verdict 上报：若用户先点了「未解决」再复制，这里不能把它洗成 none。
   一条 assistant 都没勾到就退回到最近一条回答。 */
function markCopied(items){
  let targets = items.filter(m=>m && m.role==="assistant" && m.cid);
  if(!targets.length){
    const last=[...thread].reverse().find(m=>m && m.role==="assistant" && m.cid);
    if(last) targets=[last];
  }
  targets.forEach(m=>reportCase(m,"copy"));
  return targets.length;
}

function _fmtTime(ts){

}
/* ⚠️ 2026-10-23：把「邀请列表」的渲染抽成函数 —— 生成邀请后要能**只刷新这一块**。
   原来生成完**什么都不刷新**（只有作废/重新启用会 wrap.remove()+openAdmin() 重开面板），
   于是新生成的邀请**根本不出现在列表里**，要关掉面板重开才看得到（主人报的「列表没有数据&不刷新」）。
   而又不能直接 openAdmin() —— 那会把刚生成的那个**链接框冲掉**，用户就没法复制了。
   ⇒ 抽成纯函数，返回 {rows, count}，供首次渲染与局部刷新共用。 */
function buildInviteList(d){
  const invAll=d.invites||[];
  // ⚠️ 2026-10-23：**不能只看 enabled/exp 判"可用"** —— 一次性邀请被别人领走后，
  //   它仍然 enabled、也还没过期，但**已经不能再用**。以后端下发的 `usable` 为准
  //   （后端没给该字段时退回老判据，保证前后端不同版本也能跑）。
  const _invUsable=v=>(v.usable!==undefined)
      ? !!v.usable
      : !!(v.enabled && !(v.exp && v.exp*1000 < Date.now()));
  // ⚠️⚠️ 2026-10-23 修（主人报「邀请生成后无效」的真实根因）：
  //   一次性邀请**被别人领走之后**，记录仍然 enabled、也还没过期 ——
  //   原来列表只按 enabled/exp 判，于是它**照样显示"可用"**，管理员就把它发给了下一个人，
  //   对方打开必然 410「已经被领取过了」。
  //   实测：线上 25 条邀请里有 **4 条**处于这种"已被领取却显示可用"的状态（全是一次性），
  //   而**6 条一次性邀请无一例外全被领过** —— 也就是说这个坑**每条一次性邀请都会踩一次**。
  //   ⇒ 两处修：① 以后端 `usable` 为"能不能用"的唯一判据；
  //            ② **不再把它藏起来**，而是**留在列表里标成「已领取」** ——
  //               藏起来管理员只会以为"我的邀请哪去了"，显示出来才能一眼看懂。
  const invShown=invAll.filter(v=>!!v.enabled && !((v.exp||0)*1000 < Date.now()));   // 在列表里显示的（含已领取）
  const invUsableCnt=invAll.filter(_invUsable).length;                               // 真正还能用的
  const invDeadCnt=invAll.length-invShown.length;                                    // 已作废/已过期，不显示
  const invRows=invShown.map(v=>{
    const isOne=(v.kind==="single");
    const claimed=(v.claimed||0);
    const usable=_invUsable(v);
    // 状态文案：已领取的一次性邀请必须说清"为什么不能用"，否则又回到"看着能用、点了 410"
    let status;
    if(usable) status='<span style="color:#15803d">可用</span>';
    else if(isOne && claimed) status='<span style="color:#b45309;font-weight:600">已领取，不可再用</span>';
    else status='<span style="color:#94a3b8">不可用</span>';
    return `<tr>
      <td>${esc(v.id)}</td>
      <td>${isOne?'<span style="color:#b45309;font-weight:600">一次性</span>':'多人共用'}</td>
      <td>${esc(v.note||"")}</td>
      <td>${_fmtTime(v.exp)}</td><td>${claimed}</td>
      <td>${status}</td>
      <td><button type="button" class="adm-btn danger" data-inv="${esc(v.id)}">作废</button>${
        (!usable && claimed)
          ? `<button type="button" class="adm-btn" data-invreset="${esc(v.id)}" title="清空「已领」名单，让这条链接能再服务一个人（已领过的人不受影响）">重新启用</button>`
          : ""}</td></tr>`;
  }).join("") || `<tr><td colspan="7" style="color:#64748b">（暂无邀请）</td></tr>`;
  const count = `邀请（可用 ${invUsableCnt} 条`
    + ((invShown.length-invUsableCnt) ? `<span style="color:#b45309;font-weight:400;font-size:12px">，${invShown.length-invUsableCnt} 条已领取/不可用</span>` : "")
    + (invDeadCnt ? `<span style="color:#94a3b8;font-weight:400;font-size:12px">，另有 ${invDeadCnt} 条已失效不显示</span>` : "")
    + `）`;
  return {rows:invRows, count:count};
}

/* 生成邀请后**局部刷新列表**：只换 tbody 与计数，**不动上面那个链接框**。
   ⚠️ 顺带**自动展开列表** —— 否则列表是收起状态，用户还是看不到新邀请（照样是「没刷新」的观感）。 */

        <div style="color:#64748b;font-size:12px">知识库</div>

        <div style="margin-top:3px">${esc(sys.provider||"-")} ${esc(sys.model||"")}</div>

    </div>
    <!-- 使用统计（2026-10-12 主人要求）-->
    <div style="display:flex;align-items:center;gap:8px;margin:2px 0 8px">
      <b style="font-size:13.5px">📊 使用统计</b>
      <select id="admUsageDays" style="border:1px solid #cbd5e1;border-radius:8px;padding:3px 7px;font-size:12px;font-family:inherit;background:#fff">

    <div style="display:flex;gap:8px;margin-bottom:12px">

      <span id="admTip" style="align-self:center;color:#64748b;font-size:12px"></span>
    </div>
    <!-- 2026-09-25：用户/邀请列表默认收起，点击标题展开（31 条平铺太占高度）-->
    <div id="admUsersHead" style="margin-bottom:6px;color:#334155;font-weight:600;cursor:pointer;user-select:none">
